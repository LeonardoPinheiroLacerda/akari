name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sonar:
    name: Build, testes e análise Sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura o JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven/Sonar
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Garante que o projeto existe e é público no SonarCloud
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -s -u "$SONAR_TOKEN:" -X POST \
            "https://sonarcloud.io/api/projects/create?project=akari&name=akari&organization=leonardopinheirolacerda&visibility=public" \
            -o /dev/null -w "status: %{http_code}\n" || true

      # Precisa rodar ANTES da primeira análise: o projects/create sempre nasce
      # com uma branch "master" vazia marcada como principal. Se a análise sob
      # "main" rodar antes do rename, o SonarCloud cria "main" como branch curta
      # (feature/PR) separada — e depois não dá mais pra renomear "master" pra
      # "main" (colisão de nome com a branch que já existe).
      - name: Garante que "main" é a branch principal no SonarCloud
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -s -u "$SONAR_TOKEN:" -X POST \
            "https://sonarcloud.io/api/project_branches/rename?project=akari&name=main" \
            -o /dev/null -w "status: %{http_code}\n" || true

      - name: Build, testes e análise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify sonar:sonar

  trivy-deps:
    name: Trivy - dependências Maven
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan de dependências (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: pom.xml
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-deps.sarif

      - name: Publica resultado na aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

  trivy-images:
    name: Trivy - imagem ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:17-alpine
          - rclone/rclone:1.75.1
    steps:
      - name: Scan da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-image.sarif

      - name: Publica resultado na aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ strategy.job-index }}
