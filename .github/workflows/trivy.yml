name: Trivy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-images:
    name: Lista imagens do docker-compose.yml
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lista as imagens
        id: list
        run: |
          images=$(docker compose config --images | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "images=$images" >> "$GITHUB_OUTPUT"

  trivy-deps:
    name: Trivy - dependências Maven
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan de dependências (SCA)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pom.xml
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-deps.sarif

      - name: Publica resultado na aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

  trivy-images:
    name: Trivy - imagem ${{ matrix.image }}
    needs: compose-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.compose-images.outputs.images) }}
    steps:
      - name: Scan da imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          output: trivy-image.txt

      - name: Publica resumo no Job Summary
        if: always()
        run: |
          {
            echo "### Trivy — imagem \`${{ matrix.image }}\`"
            echo '```'
            cat trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
