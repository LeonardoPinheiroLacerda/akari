# Ambiente de PRODUÇÃO
# Uso: docker compose up --build -d
# Credenciais do banco: defina DB_USERNAME/DB_PASSWORD num .env (ignorado pelo git);
# sem isso, valem os defaults abaixo.
services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: akari
      POSTGRES_USER: ${DB_USERNAME:-akari}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-akari}

    volumes:
      # Dados persistentes entre recriações do container
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  akari:
    build:
      context: .
      dockerfile: Dockerfile
    image: akari:prod

    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/akari
      QUARKUS_DATASOURCE_USERNAME: ${DB_USERNAME:-akari}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-akari}

    ports:
      # HTTP
      - "8080:8080"

    # O Flyway migra na inicialização: só sobe com o banco aceitando conexões
    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres-data:
