quarkus.package.jar.type=mutable-jar
quarkus.live-reload.password=changeit

quarkus.http.host=0.0.0.0

mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=true

# CORS: o frontend (akari-portal) roda em origem própria (Vite dev server em dev,
# host estático em produção) e precisa chamar essa API via browser. Ajuste
# CORS_ORIGINS em produção para a(s) origem(ns) real(is) do frontend.
# exposed-headers inclui o header custom do playback (TTL do heartbeat) e o
# Location devolvido na criação de storage providers, que senão o browser esconde do JS.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8099,http://localhost}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=X-Playback-Heartbeat-Ttl-Seconds,Location
quarkus.http.cors.access-control-max-age=PT24H

# Banco: PostgreSQL rodando via docker-compose (só a dependência, não a app),
# com a porta publicada em localhost. Credenciais iguais ao default do compose;
# sobrescreva com as mesmas env vars (DB_USERNAME/DB_PASSWORD) se tiver mudado lá.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_HOST:jdbc:postgresql://localhost:5432/akari}
quarkus.datasource.username=${DB_USERNAME:akari}
quarkus.datasource.password=${DB_PASSWORD:akari}

quarkus.flyway.locations=classpath:db
quarkus.flyway.migrate-at-start=true

# configuração necessária para trabalhar com campos json do postgres
quarkus.hibernate-orm.mapping.format.global=ignore

# rclone: instância local do rcd (ver rclone-rcd.sh), não containerizada — assim
# ela enxerga o mesmo filesystem do host que a app (cache.dir sem volume compartilhado).
quarkus.rest-client.rclone.url=${RCLONE_HOST:http://localhost:5572}

# AniList: endpoint GraphQL público, sem autenticação.
quarkus.rest-client.anilist.url=${ANILIST_HOST:https://graphql.anilist.co}

# TMDB: autenticação via Authorization: Bearer <token>, montado por chamada no service
# (token vem da preferência tmdb.api-key, não dá pra resolver em config estática).
quarkus.rest-client.tmdb.url=${TMDB_HOST:https://api.themoviedb.org}

# anibridge: API do GitHub, só pra descobrir a release mais recente do dataset de mapeamento.
# O download do asset em si não passa por esse client (ver AnibridgeClient).
quarkus.rest-client.anibridge.url=${ANIBRIDGE_HOST:https://api.github.com}

# ffprobe: binário resolvido via PATH por padrão; aponte pra um caminho absoluto se precisar.
# Timeout por chamada de probe.
akari.mediaprobe.ffprobe.binary=ffprobe
akari.mediaprobe.ffprobe.timeout=PT30S

# ffmpeg: binário resolvido via PATH por padrão; aponte pra um caminho absoluto se precisar.
akari.playback.ffmpeg.binary=ffmpeg

# HV000271: o openapi-generator 7.25.0 duplica @Valid (container + argumento de
# tipo) em todo DTO gerado com array/map validável — bug conhecido, corrigido
# upstream mas ainda sem release (https://github.com/OpenAPITools/openapi-generator/pull/24176).
# Silencia só esse logger; a validação em si não é afetada.
quarkus.log.category."org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder".level=ERROR

# Testes: H2 em memória no modo de compatibilidade com PostgreSQL. O schema vem do próprio
# Hibernate (mapeamento das entidades), não do Flyway — as migrations em db/ usam sintaxe
# específica do Postgres (ex.: TIMESTAMPTZ) que o H2 não entende.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:akari;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
