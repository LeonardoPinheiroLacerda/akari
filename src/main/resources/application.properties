quarkus.package.jar.type=mutable-jar
quarkus.live-reload.password=changeit

mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=true

# Banco: PostgreSQL. URL e credenciais vêm do ambiente (QUARKUS_DATASOURCE_JDBC_URL,
# QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD), definidas no docker-compose.
# Sem URL, o quarkus:dev sobe um PostgreSQL descartável via Dev Services (exige Docker).
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# Testes: H2 em memória no modo de compatibilidade com PostgreSQL.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:akari;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
