        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- animemetadata ----------
  /v1/metadata/animes/{anilistId}:
    parameters:
      - $ref: '#/components/parameters/AnilistIdPathParam'
    get:
      tags: [Anime]
      operationId: getAnime
      summary: Lê a metadata do anime (base local, sem buscar de novo na AniList)
      responses:
        '200':
          $ref: '#/components/responses/AnimeOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Anime]
      operationId: deleteAnime
      summary: Remove a metadata; a pasta volta a ficar livre
      responses:
        '204':
          $ref: '#/components/responses/AnimeDeleted'
        '404':
          $ref: '#/components/responses/NotFound'
