      summary: Lista as preferências, opcionalmente filtrando por nome (substring da chave)
      description: >-
        Sem o parâmetro `name`, devolve todas as preferências ordenadas pela chave. Com `name`,
        filtra por substring case-insensitive da chave, também ordenado.
      parameters:
        - $ref: '#/components/parameters/NameFilterParam'
      responses:
        '200':
          $ref: '#/components/responses/SettingListOk'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/settings/{key}:
    parameters:
      - $ref: '#/components/parameters/SettingKeyPathParam'
    put:
      tags: [Setting]
      operationId: updateSetting
      summary: Atualiza o valor de uma preferência existente
      description: >-
        Só preferências já cadastradas podem ser atualizadas — chave inexistente responde `404`.
      requestBody:
        $ref: '#/components/requestBodies/UpdateSettingRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SettingOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- notification ----------
  /v1/notifications:
    get:
      tags: [Notification]
      operationId: listNotifications
      summary: Lista paginada das notificações, da mais nova para a mais antiga
      description: |
        Página de notificações, lidas ou não, ordenadas da mais nova para a mais antiga —
        pensada para um botão "ver mais" no cliente (cada clique pede a próxima `page`).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          $ref: '#/components/responses/NotificationPageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/unread-count:
    get:
      tags: [Notification]
      operationId: getUnreadCount
      summary: Conta as notificações não-lidas
      responses:
        '200':
          $ref: '#/components/responses/UnreadCountOk'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationIdPathParam'
    post:
      tags: [Notification]
      operationId: markNotificationRead
      summary: Marca uma notificação como lida
      description: |
        Idempotente: marcar de novo uma notificação já lida responde `204`. Um
        `notificationId` inexistente também responde `204` — nada é alterado. `404` só quando
        o `notificationId` não é numérico.
      responses:
        '204':
          $ref: '#/components/responses/NotificationRead'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notifications/read-all:
    post:
      tags: [Notification]
      operationId: markAllNotificationsRead
      summary: Marca todas as notificações como lidas
      responses:
        '204':
          $ref: '#/components/responses/AllNotificationsRead'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- smartlist ----------
  /v1/smart-lists:
    get:
      tags: [SmartList]
      operationId: listSmartLists
      summary: Lista as listas cadastradas
      description: Ordenadas por `position` crescente; empate desempata pelo `id`.
      responses:
        '200':
          $ref: '#/components/responses/SmartListListOk'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [SmartList]
      operationId: createSmartList
      summary: Cadastra uma lista
      requestBody:
        $ref: '#/components/requestBodies/SmartListRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/SmartListCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/smart-lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/SmartListIdPathParam'
    get:
      tags: [SmartList]
      operationId: getSmartList
      summary: Busca uma lista por id
      responses:
        '200':
          $ref: '#/components/responses/SmartListOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [SmartList]
      operationId: updateSmartList
      summary: Atualiza uma lista
      requestBody:
        $ref: '#/components/requestBodies/SmartListRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/SmartListOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [SmartList]
      operationId: deleteSmartList
      summary: Remove uma lista
      responses:
        '204':
          description: Lista removida
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/smart-lists/{listId}/items:
    parameters:
      - $ref: '#/components/parameters/SmartListIdPathParam'
    get:
      tags: [SmartList]
      operationId: listSmartListItems
      summary: Itens da lista (paginado)
      description: |
        Os itens são as raízes das franquias (ver `GET /v1/metadata/franchises`) que passam no
        filtro da lista. Animes ocultos são ignorados.

        - **Critérios de franquia** (`includeGenres`, `excludeGenres`, `includeTags`,
          `excludeTags`, `studios`, `statuses`, `adult`): a raiz entra se **algum membro** da
          franquia, incluindo ela, casar todos eles ao mesmo tempo.
        - **Critérios de raiz** (`formats`, `yearFrom`, `yearTo`, `minScore`, `minMeanScore`,
          `minPopularity`): valem só pra raiz.

        A ordenação usa o valor da raiz; valores ausentes vão pro fim e o empate desempata pelo
        `anilistId`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          $ref: '#/components/responses/AnimeBindingSummaryPageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------- user ----------
  /v1/users:
    get:
      tags: [User]
      operationId: listUsers
      summary: Lista os usuários
      description: Ordenados por `id`.
      responses:
        '200':
          $ref: '#/components/responses/UserListOk'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [User]
      operationId: createUser
      summary: Cadastra um usuário
      requestBody:
        $ref: '#/components/requestBodies/UserRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdPathParam'
    delete:
      tags: [User]
      operationId: deleteUser
      summary: Remove um usuário
      description: |
        Remove o usuário e tudo o que é dele: o histórico de visualização e a lista de títulos.
        Uma sessão de playback em andamento do usuário não é interrompida: ela segue sem
        usuário (para de gravar progresso) até expirar normalmente. Responde `404` se o usuário
        não existir.
      responses:
        '204':
          description: Usuário removido
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/users/{userId}/watchlist:
    parameters:
      - $ref: '#/components/parameters/UserIdPathParam'
    get:
      tags: [User]
      operationId: listUserWatchlist
      summary: Lista de títulos do usuário (paginado)
      description: Do título adicionado mais recentemente pro mais antigo.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          $ref: '#/components/responses/AnimeBindingSummaryPageOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [User]
      operationId: addUserWatchlistItem
      summary: Adiciona um título à lista do usuário
      description: |
        Idempotente: adicionar um título que já está na lista não faz nada. Responde `404` se o
        usuário ou o anime não existir.
      requestBody:
        $ref: '#/components/requestBodies/WatchlistItemRequestBody'
      responses:
        '204':
          description: Título na lista
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/users/{userId}/watchlist/{anilistId}:
    parameters:
      - $ref: '#/components/parameters/UserIdPathParam'
      - $ref: '#/components/parameters/AnilistIdPathParam'
    delete:
      tags: [User]
      operationId: removeUserWatchlistItem
      summary: Remove um título da lista do usuário
      description: |
        Idempotente: remover um título que não está na lista responde `204` sem fazer nada.
        Responde `404` só se o usuário não existir.
      responses:
        '204':
          description: Título fora da lista
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  parameters:
    # ---------- comuns ----------
    PageParam:
      name: page
      in: query
      required: false
      description: Número da página (0-based)
      schema:
        $ref: '#/components/schemas/PageNumber'
    SizeParam:
      name: size
      in: query
      required: false
      description: Tamanho da página
      schema:
        $ref: '#/components/schemas/PageSize'
    SearchQueryParam:
      name: q
      in: query
      required: true
      description: Texto de busca, repassado ao upstream (AniList ou TMDB)
      schema:
        $ref: '#/components/schemas/SearchQuery'
    ForceRefreshParam:
      name: forceRefresh
      in: query
      required: false
      description: Se `true`, ignora o cache local e busca de novo no upstream (AniList ou TMDB)
      schema:
        $ref: '#/components/schemas/ForceRefresh'
    NameFilterParam:
      name: name
      in: query
      required: false
      description: >-
        Substring case-insensitive do nome (da pasta ou da chave da preferência); `null`/ausente não
        filtra
      schema:
        $ref: '#/components/schemas/NameFilter'
    FileIdPathParam:
      name: fileId
      in: path
      required: true
      description: Id do arquivo de vídeo no catalog
      schema:
        $ref: '#/components/schemas/FileId'
    FolderIdPathParam:
      name: folderId
      in: path
      required: true
      description: Id da pasta no catalog
      schema:
        $ref: '#/components/schemas/FolderId'
    StorageProviderIdPathParam:
      name: providerId
      in: path
      required: true
      description: Id do storage provider
      schema:
        $ref: '#/components/schemas/StorageProviderId'

    # ---------- ingestion ----------
    RootPathParam:
      name: rootPath
      in: query
      required: false
      description: Prefixo do subtree; ausente ou vazio parte da raiz do provider
      schema:
        $ref: '#/components/schemas/RootPath'

    # ---------- catalog ----------
    MediaTypeFilterParam:
      name: mediaType
      in: query
      required: false
      description: Tipo do conteúdo; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/MediaType'
    StorageProviderIdFilterParam:
      name: storageProviderId
      in: query
      required: false
      description: Provider dono; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/StorageProviderId'
    ParentIdFilterParam:
      name: parentId
      in: query
      required: false
      description: Pasta pai; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/FolderId'
    HasFilesFilterParam:
      name: hasFiles
      in: query
      required: false
      description: Filtra por existência de arquivos; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/HasFilesFilter'
    ReviewStatusFilterParam:
      name: reviewStatus
      in: query
      required: false
      description: Status de revisão do anime vinculado; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/AnimeReviewStatus'
    HasAnilistFilterParam:
      name: hasAnilist
      in: query
      required: false
      description: Filtra por ter ou não anime vinculado à AniList; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/HasAnilistFilter'
    HasTmdbFilterParam:
      name: hasTmdb
      in: query
      required: false
      description: Filtra por ter ou não binding TMDB; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/HasTmdbFilter'
    AllEpisodesPairedFilterParam:
      name: allEpisodesPaired
      in: query
      required: false
      description: >-
        Filtra por ter todo arquivo pareado ao TMDB; pastas sem nenhum arquivo não batem com
        nenhum dos dois valores; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/AllEpisodesPairedFilter'
    SortParam:
      name: sort
      in: query
      required: false
      description: |
        Specs de ordenação `field[:asc|desc]`. Whitelist: `name`, `createdAt`. Múltiplos
        valores viram lista ordenada.
      explode: true
      schema:
        $ref: '#/components/schemas/SortSpecs'
    FolderIdRequiredParam:
      name: folderId
      in: query
      required: true
      description: Id da pasta cujos arquivos serão listados
      schema:
        $ref: '#/components/schemas/FolderId'

    # ---------- cache ----------
    PendingOnlyFilterParam:
      name: pendingOnly
      in: query
      required: false
      description: Restringe às linhas com status diferente de `COMPLETED`; `null`/ausente não filtra
      schema:
        $ref: '#/components/schemas/PendingOnlyFilter'
    CacheItemIdPathParam:
      name: itemId
      in: path
      required: true
      description: Id da linha do cache
      schema:
        $ref: '#/components/schemas/CacheItemId'

    # ---------- playback ----------
    SessionIdPathParam:
      name: sessionId
      in: path
      required: true
      description: Id da sessão de playback (UUID gerado ao iniciar o transcode)
      schema:
        $ref: '#/components/schemas/SessionId'
    MediaFilePathParam:
      name: file
      in: path
      required: true
      description: |
        Nome de um arquivo referenciado pela playlist da sessão (ver `MediaFileName`). Qualquer
        outro nome responde `404`.
      schema:
        $ref: '#/components/schemas/MediaFileName'

    # ---------- tmdb ----------
    LanguageParam:
      name: language
      in: query
      required: false
      description: >-
        Idioma dos textos devolvidos, como tag BCP 47 (ex.: `en-US`, `pt-BR`). Omitido, usa a
        preferência `tmdb.default-language`.
      schema:
        $ref: '#/components/schemas/Language'

    # ---------- animemetadata ----------
    AnilistIdPathParam:
      name: anilistId
      in: path
      required: true
      description: ID do anime na AniList
      schema:
        $ref: '#/components/schemas/AnilistId'
    RootIdPathParam:
      name: rootId
      in: path
      required: true
      description: ID na AniList do anime raiz da franquia
      schema:
        $ref: '#/components/schemas/AnilistId'
    FranchiseSearchParam:
      name: q
      in: query
      required: false
      description: Texto buscado no título da raiz e dos membros
      schema:
        type: string
    FranchiseKindFilterParam:
      name: kind
      in: query
      required: false
      description: Filtra pelo tipo de raiz
      schema:
        $ref: '#/components/schemas/FranchiseKind'
    DepthParam:
      name: depth
      in: query
      required: false
      description: Profundidade máxima da BFS
      schema:
        $ref: '#/components/schemas/GraphDepth'

    # ---------- settings ----------
    SettingKeyPathParam:
      name: key
      in: path
      required: true
      description: 'Chave da preferência (ex.: `cache.max-size-bytes`)'
      schema:
        $ref: '#/components/schemas/SettingKey'

    # ---------- notification ----------
    IngestionTaskIdPathParam:
      name: taskId
      in: path
      required: true
      description: Id da tarefa de ingestão
      schema:
        $ref: '#/components/schemas/IngestionTaskId'
    NotificationIdPathParam:
      name: notificationId
      in: path
      required: true
      description: Id da notificação
      schema:
        type: integer
        format: int32

    # ---------- smartlist ----------
    SmartListIdPathParam:
      name: listId
      in: path
      required: true
      description: Id da lista
      schema:
        type: integer
        format: int32
    UserIdPathParam:
      name: userId
      in: path
      required: true
      description: Id do usuário
      schema:
        $ref: '#/components/schemas/UserId'
    UserIdQueryParam:
      name: userId
      in: query
      required: false
      description: |
        Id do usuário. Quando informado, a resposta traz o estado desse usuário: o
        `watchProgress` de cada episódio na listagem de episódios, ou o `inWatchlist` na
        franquia.
      schema:
        $ref: '#/components/schemas/UserId'

  requestBodies:
    # ---------- storageprovider ----------
    CreateStorageProviderRequestBody:
      description: Payload de criação — type + config em claro
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateStorageProviderRequest'
    UpdateStorageProviderConfigRequestBody:
      description: Payload de atualização de config em claro
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateStorageProviderConfigRequest'

    # ---------- ingestion ----------
    IngestSubtreeRequestBody:
      description: Payload de ingestão — subtree + mediaType a aplicar
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestSubtreeRequest'

    # ---------- catalog ----------
    MediaFolderRequestBody:
      description: Payload de criação/atualização de pasta
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaFolderRequest'
    VideoFileRequestBody:
      description: Payload de criação/atualização de arquivo
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VideoFileRequest'

    # ---------- cache ----------
    CacheQueueRequestBody:
      description: Arquivo a ser cacheado
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CacheQueueRequest'

    # ---------- playback ----------
    StartPlaybackSessionRequestBody:
      description: Arquivo, perfil e faixas da sessão a iniciar
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StartPlaybackSessionRequest'
    SeekRequestBody:
      description: Nova posição do transcode
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SeekRequest'
    SwitchTracksRequestBody:
      description: Nova posição e faixas de áudio/legenda da sessão
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SwitchTracksRequest'

    # ---------- animemetadata ----------
    AnimeBindingRequestBody:
      description: Payload de binding anime↔pasta
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnimeBindingRequest'
    AnimeFranchiseAssignmentRequestBody:
      description: Nova atribuição de franquia do anime
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnimeFranchiseAssignmentRequest'
    CreateFranchiseRequestBody:
      description: Anime que vira raiz da nova franquia manual
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateFranchiseRequest'
    TmdbBindingRequestBody:
      description: Payload de binding anime↔TMDB
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbBindingRequest'
    TmdbFilePairingProposalRequestBody:
      description: Anime cujos arquivos devem receber a proposta de pairing
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbFilePairingProposalRequest'
    TmdbBindingProposalRequestBody:
      description: Anime da AniList pra propor o binding TMDB
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbBindingProposalRequest'
    TmdbOverridesRequestBody:
      description: Payload de overrides
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbOverrides'
    TmdbFilePairingRequestBody:
      description: Payload de pairing
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TmdbFilePairingRequest'

    # ---------- settings ----------
    UpdateSettingRequestBody:
      description: Novo valor da preferência
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateSettingRequest'

    # ---------- smartlist ----------
    SmartListRequestBody:
      description: Nome, posição, filtro e ordenação da lista
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SmartListRequest'
    # ---------- user ----------
    UserRequestBody:
      description: Nome do usuário
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRequest'
    WatchlistItemRequestBody:
      description: Título a adicionar na lista
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WatchlistItemRequest'
    PlaybackHeartbeatRequestBody:
      description: Posição atual do player
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlaybackHeartbeatRequest'

  responses:
    # ---------- comuns ----------
    BadRequest:
      description: >-
        Payload ou parâmetros inválidos (`VALIDATION_ERROR`), ou regra de negócio violada
        (`BUSINESS_RULE_VIOLATION`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso inexistente (`RESOURCE_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: O recurso já existe ou está num estado incompatível (`CONFLICT`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadGateway:
      description: >-
        Falha num sistema externo — AniList, TMDB, rclone ou ffprobe (`INTEGRATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: >-
        Preferência obrigatória sem valor (`INTEGRATION_NOT_CONFIGURED`) — configure em `PUT
        /v1/settings/{key}`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Erro inesperado no servidor (`INTERNAL_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TranscodeFailed:
      description: >-
        O transcode da sessão de playback falhou e não vai gerar a playlist
        (`TRANSCODE_FAILED`), ou erro inesperado no servidor (`INTERNAL_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    # ---------- storageprovider ----------
    StorageProviderPageOk:
      description: Página (possivelmente vazia) de providers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageProviderPage'
    StorageProviderOk:
      description: Provider encontrado/atualizado (sem `config`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageProviderResponse'
    StorageProviderCreated:
      description: Provider cadastrado (sem `config`)
      headers:
        Location:
          description: URI do provider recém-criado (`/v1/storage/providers/{providerId}`)
          schema:
            type: string
