    post:
      tags: [Anime]
      operationId: bindAnimeToFolder
      summary: Cria metadata do anime atrelada a uma pasta do catalog
      requestBody:
        $ref: '#/components/requestBodies/AnimeBindingRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/AnimeCreated'
