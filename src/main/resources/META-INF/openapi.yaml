  schemas:
    # ---------- comuns ----------
    FileId:
      type: integer
      format: int32
      description: Id do arquivo de vídeo no catalog

    FolderId:
      type: integer
      format: int32
      description: Id da pasta no catalog

    StorageProviderId:
      type: integer
      format: int32
      description: Id do storage provider

    AnilistId:
      type: integer
      format: int32
      description: ID do anime na AniList — chave primária do anime no akari

    TmdbId:
      type: integer
      format: int32
      description: Id de um recurso no TMDB (série ou filme)

    PageNumber:
      type: integer
      format: int32
      default: 0
      description: Número da página (0-based)

    PageSize:
      type: integer
      format: int32
      default: 12
      description: Tamanho máximo de itens por página

    PageTotalElements:
      type: integer
      format: int64
      description: Total absoluto de elementos que existem para a query

    PageTotalPages:
      type: integer
      format: int32
      description: Total de páginas calculado a partir de totalElements e size

    Page:
      type: object
      description: |
        Metadados de paginação, comuns a todo envelope paginado. Cada envelope
        (`MediaFolderPage`, `CacheItemPage`, ...) compõe este schema com o array `data` do seu tipo.
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          $ref: '#/components/schemas/PageNumber'
        size:
          $ref: '#/components/schemas/PageSize'
        totalElements:
          $ref: '#/components/schemas/PageTotalElements'
        totalPages:
          $ref: '#/components/schemas/PageTotalPages'

    NameFilter:
      type: string
      description: Substring case-insensitive aplicada ao nome

    SearchQuery:
      type: string
      minLength: 1
      description: Texto de busca (obrigatório, não vazio)

    ForceRefresh:
      type: boolean
      default: false
      description: Ignora o cache quando `true`

    MediaType:
      type: string
      description: |
        Tipo do conteúdo abrigado por uma pasta. Gravado na pasta quando ela é criada (pela
        ingestão ou pelo `POST /v1/catalog/folders`); a ingestão não altera pastas já registradas.
      enum:
        - ANIME
        - TV
        - MOVIE

    ErrorDetail:
      type: object
      description: Violação de um campo — só aparece em erros `VALIDATION_ERROR`
      required: [field, error]
      properties:
        field:
          type: string
          description: >-
            Campo violado: caminho em dot-notation quando está no body (ex.: `config.password`) ou o
            nome do parâmetro (ex.: `size`)
        error:
          type: string
          description: Mensagem legível da violação

    ApiErrorCode:
      type: string
      description: |
        Chave estável do erro — o cliente chaveia o tratamento por ela, nunca pelo `message`.

        - `VALIDATION_ERROR` (400): payload ou parâmetros inválidos (Bean Validation ou JSON
          malformado); `details` lista as violações.
        - `BUSINESS_RULE_VIOLATION` (400): o input é válido na forma, mas fere uma regra de
          negócio.
        - `RESOURCE_NOT_FOUND` (404): o recurso não existe (ou a rota não existe / um
          parâmetro de path não pôde ser convertido).
        - `CONFLICT` (409): o recurso que se quer criar já existe ou o estado atual impede a
          operação.
        - `REQUEST_ERROR` (405, 406, 415, ...): requisição incompatível com o endpoint —
          método, `Content-Type` ou `Accept` não suportados.
        - `INTEGRATION_ERROR` (502): um sistema externo (AniList, TMDB, rclone, ffprobe)
          falhou ou está indisponível.
        - `INTEGRATION_NOT_CONFIGURED` (503): uma preferência obrigatória está sem valor —
          o admin precisa configurá-la em
          `PUT /v1/settings/{key}`.
        - `TRANSCODE_FAILED` (500): o transcode de uma sessão de playback saiu com erro antes de
          gerar a playlist (ou depois de já ter gerado) e não vai se recuperar — o cliente deve parar
          de tentar e mostrar erro, diferente do `RESOURCE_NOT_FOUND` de "ainda não gerada".
        - `INTERNAL_ERROR` (500): erro inesperado no servidor.
      enum:
        - VALIDATION_ERROR
        - BUSINESS_RULE_VIOLATION
        - RESOURCE_NOT_FOUND
        - CONFLICT
        - REQUEST_ERROR
        - INTEGRATION_ERROR
        - INTEGRATION_NOT_CONFIGURED
        - TRANSCODE_FAILED
        - INTERNAL_ERROR

    ApiError:
      type: object
      description: |
        Shape uniforme de erro da API, produzido pelos `ExceptionMapper`s globais. Todo status
        de erro (4xx/5xx) devolve este corpo.
      required: [status, code, message, details]
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status devolvido (o mesmo da resposta)
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
          description: Mensagem legível para logging/exibição
        details:
          type: array
          description: Violações por campo; vazia quando `code` não é `VALIDATION_ERROR`
          items:
            $ref: '#/components/schemas/ErrorDetail'

    # ---------- storageprovider ----------
    StorageProviderType:
      type: string
      description: |
        Tipo do provider. Cada valor implica um schema de `config` distinto (ex.: `MEGA`
        exige `email`+`password`; `LOCAL` exige `rootPath`). Novos providers vão surgir aqui
        à medida que forem suportados.
      enum:
        - MEGA
        - LOCAL

    StorageProviderConfig:
      type: object
      description: |
        Configuração do provider — mapa livre de string→string. O conjunto de chaves
        obrigatórias depende de `type`. Para `MEGA`: `email` (obrigatório), `password`
        (obrigatório, será obscurecido antes de persistir). Para `LOCAL`: `rootPath`
        (obrigatório, diretório raiz absoluto dos arquivos no disco do servidor).
      additionalProperties:
        type: string

    CreateStorageProviderRequest:
      type: object
      description: Payload de `POST /v1/storage/providers`
      required: [type, config]
      properties:
        type:
          $ref: '#/components/schemas/StorageProviderType'
        config:
          $ref: '#/components/schemas/StorageProviderConfig'

    UpdateStorageProviderConfigRequest:
      type: object
      description: Payload de `PUT /v1/storage/providers/{providerId}/config`
      required: [config]
      properties:
        config:
          $ref: '#/components/schemas/StorageProviderConfig'

    StorageProviderResponse:
      type: object
      description: |
        Vista pública do provider. `config` é intencionalmente omitido para evitar
        vazar credenciais (mesmo obscurecidas) para clientes da API.
      required: [id, type, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/StorageProviderId'
        type:
          $ref: '#/components/schemas/StorageProviderType'
        createdAt:
          type: string
          format: date-time

    StorageProviderHealth:
      type: object
      description: Resultado do teste de conectividade com o provider
      required: [healthy]
      properties:
        healthy:
          type: boolean
          description: '`true` se o provider respondeu; `false` se está inacessível'

    StorageProviderPage:
      description: Envelope paginado de providers
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StorageProviderResponse'

    # ---------- ingestion ----------
    RootPath:
      type: string
      description: Caminho relativo à raiz do provider

    IngestSubtreeRequest:
      type: object
      description: Payload de `POST /v1/ingestion/providers/{providerId}`
      required: [mediaType]
      properties:
        rootPath:
          allOf: [{ $ref: '#/components/schemas/RootPath' }]
          nullable: true
          description: '`null` ou vazio ingere a raiz inteira do provider'
        mediaType:
          $ref: '#/components/schemas/MediaType'

    IngestionStartedResponse:
      type: object
      description: Confirmação de que a ingestão em background foi aceita
      required: [status]
      properties:
        status:
          type: string
          description: Status do disparo — hoje sempre `started`
          enum:
            - started

    AvailableFolderNode:
      type: object
      description: |
        Nó da árvore de pastas disponíveis. Recursivo — cada nó tem `children` com os
        filhos diretos. Os nós carregam o status `ingested` para o frontend destacar
        visualmente o que já está no catalog.
      required: [name, path, ingested, children]
      properties:
        name:
          type: string
          description: Último segmento do path
        path:
          type: string
          description: Caminho relativo à raiz do provider
        ingested:
          type: boolean
          description: '`true` se essa pasta já está catalogada'
        children:
          type: array
          description: Filhos diretos
          items:
            $ref: '#/components/schemas/AvailableFolderNode'

    IngestionId:
      type: integer
      format: int32
      description: Id da ingestão

    IngestionTaskId:
      type: integer
      format: int32
      description: Id da tarefa de ingestão

    IngestionStatus:
      type: string
      description: |
        Status de uma ingestão.

        - `PENDING` — criada, nenhuma tarefa começou ainda.
        - `RUNNING` — alguma tarefa já começou e ainda há tarefa por terminar.
        - `COMPLETED` — todas as tarefas terminaram, nenhuma com `FAILED`.
        - `COMPLETED_WITH_ERRORS` — todas as tarefas terminaram, alguma com `FAILED`.
        - `FAILED` / `CANCELLED` — reservados; nenhum fluxo grava hoje.
      enum:
        - PENDING
        - RUNNING
        - COMPLETED
        - COMPLETED_WITH_ERRORS
        - FAILED
        - CANCELLED

    IngestionTaskStatus:
      type: string
      description: |
        Status de uma tarefa (uma pasta) da ingestão.

        - `PENDING` — na fila, ainda não rodou.
        - `RUNNING` — rodando os steps.
        - `WAITING_CURATION` — algum step não conseguiu decidir sozinho e espera curadoria no
          portal; é um resultado esperado, não uma falha.
        - `RESOLVED` — esperava curadoria e foi marcada como resolvida manualmente
          (`PUT /v1/ingestion/tasks/{taskId}/resolve`).
        - `COMPLETED` — todos os steps terminaram.
        - `FAILED` — algum step falhou.
        - `CANCELLED` — reservado; nenhum fluxo grava hoje.
      enum:
        - PENDING
        - RUNNING
        - WAITING_CURATION
        - RESOLVED
        - COMPLETED
        - FAILED
        - CANCELLED

    IngestionStep:
      type: string
      description: |
        Step de uma tarefa, na ordem em que rodam.

        - `ANILIST_SYNC` — vincula a pasta a um anime da AniList.
        - `TMDB_BIND` — vincula o anime à série ou ao filme do TMDB.
        - `TMDB_OVERRIDES` — preenche título, sinopse e imagens a partir do TMDB.
        - `TMDB_FILEPAIR` — pareia os arquivos da pasta com os episódios do TMDB.
      enum:
        - ANILIST_SYNC
        - TMDB_BIND
        - TMDB_OVERRIDES
        - TMDB_FILEPAIR

    IngestionStepStatus:
      type: string
      description: |
        Status de uma execução de step.

        - `RUNNING` — rodando.
        - `COMPLETED` — terminou.
        - `SKIPPED` — não se aplica à pasta (ex.: pareamento de episódios de um filme).
        - `UNRESOLVED` — não conseguiu decidir sozinho; espera curadoria.
        - `FAILED` — falhou; o motivo está no evento `ERROR`.
        - `PENDING` — reservado; nenhum fluxo grava hoje.
      enum:
        - PENDING
        - RUNNING
        - COMPLETED
        - UNRESOLVED
        - FAILED
        - SKIPPED

    IngestionEventType:
      type: string
      description: |
        Tipo de um evento da linha do tempo de uma execução de step.

        - `STARTED` — a execução começou.
        - `REQUEST_SENT` — uma consulta foi feita a um serviço externo.
        - `RESPONSE_RECEIVED` — a resposta de um serviço externo chegou (só em execuções antigas).
        - `RESULTS_FOUND` — resultados encontrados.
        - `MATCH_SELECTED` — um resultado foi escolhido.
        - `MATCH_NOT_FOUND` — nenhum resultado pôde ser escolhido; espera curadoria.
        - `WARNING` — algo merece atenção, sem impedir o step.
        - `ERROR` — o step falhou.
        - `COMPLETED` — a execução terminou.
        - `SKIPPED` — o step não se aplica à pasta.
      enum:
        - STARTED
        - REQUEST_SENT
        - RESPONSE_RECEIVED
        - RESULTS_FOUND
        - MATCH_SELECTED
        - MATCH_NOT_FOUND
        - WARNING
        - ERROR
        - COMPLETED
        - SKIPPED

    IngestionTaskCounts:
      type: object
      description: |
        Quantidade de tarefas da ingestão por status. `total` conta todas as tarefas; uma tarefa
        está terminada quando está em `waitingCuration`, `resolved`, `completed` ou `failed`.
      required: [total, pending, running, waitingCuration, resolved, completed, failed]
      properties:
        total:
          type: integer
          format: int32
        pending:
          type: integer
          format: int32
        running:
          type: integer
          format: int32
        waitingCuration:
          type: integer
          format: int32
        resolved:
          type: integer
          format: int32
        completed:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32

    IngestionSummary:
      type: object
      description: |
        Uma ingestão: status, datas, quantidade de tarefas por status, a tarefa em execução —
        as tarefas rodam uma de cada vez — e todas as tarefas.
      required: [id, status, createdAt, taskCounts, tasks]
      properties:
        id:
          $ref: '#/components/schemas/IngestionId'
        status:
          $ref: '#/components/schemas/IngestionStatus'
        createdAt:
          type: string
          format: date-time
          description: Momento em que a ingestão foi disparada
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Momento em que a primeira tarefa começou; `null` enquanto `PENDING`
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Momento em que a última tarefa terminou; `null` até terminar
        taskCounts:
          $ref: '#/components/schemas/IngestionTaskCounts'
        currentTask:
          allOf: [{ $ref: '#/components/schemas/IngestionTaskSummary' }]
          nullable: true
          description: Tarefa em execução; `null` quando nenhuma está rodando
        tasks:
          type: array
          description: |
            Todas as tarefas da ingestão, na ordem em que foram criadas (a mesma em que rodam).
            A linha do tempo de cada uma fica em `GET /v1/ingestion/tasks/{taskId}`.
          items:
            $ref: '#/components/schemas/IngestionTaskSummary'

    IngestionPage:
      description: Envelope paginado de ingestões
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/IngestionSummary'

    IngestionTaskSummary:
      type: object
      description: |
        Resumo de uma tarefa (uma pasta) da ingestão: a pasta, o anime vinculado, o status e o
        status mais recente de cada step que já rodou.
      required: [id, ingestionId, folderId, folderName, status, steps, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/IngestionTaskId'
        ingestionId:
          $ref: '#/components/schemas/IngestionId'
        folderId:
          $ref: '#/components/schemas/FolderId'
        folderName:
          type: string
          description: Nome da pasta no provider
        anilistId:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          nullable: true
          description: Anime vinculado à pasta; `null` enquanto não há vínculo com a AniList
        title:
          type: string
          nullable: true
          description: Título do anime vinculado; `null` nas mesmas condições de `anilistId`
        thumbnail:
          type: string
          nullable: true
          description: URL do poster (resolução média) do anime vinculado
        status:
          $ref: '#/components/schemas/IngestionTaskStatus'
        currentStep:
          allOf: [{ $ref: '#/components/schemas/IngestionStep' }]
          nullable: true
          description: Step em execução ou o último que rodou; `null` antes do primeiro
        steps:
          type: array
          description: |
            Status da execução mais recente de cada step que já rodou, na ordem dos steps
          items:
            $ref: '#/components/schemas/IngestionTaskStepStatus'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    IngestionTaskStepStatus:
      type: object
      description: Status da execução mais recente de um step da tarefa
      required: [step, status]
      properties:
        step:
          $ref: '#/components/schemas/IngestionStep'
        status:
          $ref: '#/components/schemas/IngestionStepStatus'

    IngestionTaskDetail:
      description: Tarefa com todas as execuções dos steps e os eventos de cada uma
      allOf:
        - $ref: '#/components/schemas/IngestionTaskSummary'
        - type: object
          required: [executions]
          properties:
            executions:
              type: array
              description: Execuções dos steps, na ordem em que rodaram
              items:
                $ref: '#/components/schemas/IngestionStepExecutionDetail'

    IngestionStepExecutionDetail:
      type: object
      description: |
        Uma execução (tentativa) de um step, com a linha do tempo dos eventos dela. Um step que
        roda de novo na mesma tarefa — retomada depois de uma queda do serviço — ganha uma
        execução nova com o `attempt` seguinte.
      required: [id, step, status, attempt, createdAt, events]
      properties:
        id:
          type: integer
          format: int32
        step:
          $ref: '#/components/schemas/IngestionStep'
        status:
          $ref: '#/components/schemas/IngestionStepStatus'
        attempt:
          type: integer
          format: int32
          description: Número da tentativa do step nesta tarefa, a partir de 1
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: '`null` enquanto `RUNNING`'
        events:
          type: array
          description: Eventos da execução, na ordem em que foram gravados
          items:
            $ref: '#/components/schemas/IngestionStepEventResponse'

    IngestionStepEventResponse:
      type: object
      description: Evento da linha do tempo de uma execução de step
      required: [id, type, message, createdAt]
      properties:
        id:
          type: integer
          format: int32
        type:
          $ref: '#/components/schemas/IngestionEventType'
        message:
          type: string
          description: Frase pronta pra exibir no portal
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            Dados técnicos do evento (ids, códigos, candidatos); o formato varia com o step e o
            tipo do evento
        createdAt:
          type: string
          format: date-time

    IngestionStreamEventType:
      type: string
      description: |
        Tipo de um evento do stream SSE `GET /v1/ingestion/events`. É também o `event:` (nome) da
        mensagem SSE, então o cliente pode tanto registrar um listener por nome
        (`addEventListener('STEP_FINISHED', ...)`) quanto ler o campo `type` do payload.

        - `SNAPSHOT` — primeiro evento de quem se inscreve: a ingestão em andamento, ou a última,
          com todas as tarefas; sem nenhuma ingestão, `ingestion` vem `null`.
        - `INGESTION_UPDATED` — o status ou as contagens de uma ingestão mudaram. Traz o mesmo
          `IngestionSummary`, mas com `tasks` vazio — as tarefas chegam pelo `TASK_UPDATED`.
        - `TASK_UPDATED` — uma tarefa mudou de status ou de step.
        - `STEP_FINISHED` — uma execução de step terminou, com todos os eventos dela.
      enum:
        - SNAPSHOT
        - INGESTION_UPDATED
        - TASK_UPDATED
        - STEP_FINISHED

    IngestionStreamEvent:
      type: object
      description: |
        Payload (`data:`, JSON) de cada mensagem do stream SSE `GET /v1/ingestion/events` — o
        endpoint não é descrito em `paths` (Server-Sent Events não é modelável pelo gerador
        `jaxrs-spec`), só este payload.

        O stream é aberto com `EventSource` (`GET`, `Accept: text/event-stream`) e fica aberto
        indefinidamente: a primeira mensagem é um `SNAPSHOT`, e as seguintes chegam conforme as
        ingestões andam. Cada mensagem tem `event:` igual ao `type` e o `data:` com este objeto.
        Os campos preenchidos dependem do `type`; os demais vêm `null`:

        | `type` | Campos preenchidos |
        |---|---|
        | `SNAPSHOT` | `ingestion` (`null` se nunca houve ingestão) |
        | `INGESTION_UPDATED` | `ingestion` |
        | `TASK_UPDATED` | `task` |
        | `STEP_FINISHED` | `task`, `execution` |

        Um cliente que reconecta depois de uma queda recebe um `SNAPSHOT` novo, com a ingestão
        em andamento (ou a última) e todas as tarefas dela; outra ingestão ele recarrega por
        `GET /v1/ingestion`.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/IngestionStreamEventType'
        ingestion:
          allOf: [{ $ref: '#/components/schemas/IngestionSummary' }]
          nullable: true
        task:
          allOf: [{ $ref: '#/components/schemas/IngestionTaskSummary' }]
          nullable: true
        execution:
          allOf: [{ $ref: '#/components/schemas/IngestionStepExecutionDetail' }]
          nullable: true

    # ---------- catalog ----------
    HasFilesFilter:
      type: boolean
      description: Restringe por existência de arquivos

    HasAnilistFilter:
      type: boolean
      description: Restringe por ter ou não anime vinculado à AniList

    HasTmdbFilter:
      type: boolean
      description: >-
        Restringe por ter ou não binding TMDB; independe de `hasAnilist` — combine os dois
        pra achar só pastas com AniList vinculada mas sem TMDB

    AllEpisodesPairedFilter:
      type: boolean
      description: >-
        Restringe por ter todo arquivo de vídeo pareado ao TMDB; pastas sem nenhum arquivo
        não batem nem com `true` nem com `false`

    SortSpecs:
      type: array
      description: Lista de specs de ordenação `field[:asc|desc]`
      items:
        $ref: '#/components/schemas/SortSpec'

    SortSpec:
      type: string
      description: Spec de ordenação individual — formato `field` ou `field:asc|desc`

    MediaFolderRequest:
      type: object
      description: |
        Payload de criação e atualização de pasta. No PUT o id vem do path (`folderId`);
        `createdAt` é gerado pelo banco. A pasta pai é derivada do `path` (o pai é a pasta do
        mesmo provider cujo path é o `path` sem o último segmento; raiz se não houver) — não é
        informada no payload.
      required: [storageProviderId, mediaType, name, path]
      properties:
        storageProviderId:
          allOf: [{ $ref: '#/components/schemas/StorageProviderId' }]
          description: Id do provider onde a pasta vive
        mediaType:
          $ref: '#/components/schemas/MediaType'
        name:
          type: string
          minLength: 1
          description: Último segmento do path (nome exibido da pasta)
        path:
          type: string
          minLength: 1
          description: Caminho relativo à raiz do provider

    MediaFolderResponse:
      type: object
      description: Vista pública de uma pasta ingerida
      required: [id, storageProviderId, mediaType, name, path, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/FolderId'
        storageProviderId:
          $ref: '#/components/schemas/StorageProviderId'
        parentId:
          allOf: [{ $ref: '#/components/schemas/FolderId' }]
          nullable: true
          description: '`null` quando a pasta é raiz'
        mediaType:
          $ref: '#/components/schemas/MediaType'
        name:
          type: string
        path:
          type: string
        createdAt:
          type: string
          format: date-time
        hasFiles:
          type: boolean
          nullable: true
          description: >-
            `true` se a pasta tem ao menos um arquivo de vídeo direto. Enriquecido só na listagem
            (`GET /folders`); `null` nas leituras que não computam esse campo.
        animeBinding:
          allOf: [{ $ref: '#/components/schemas/AnimeBindingSummary' }]
          nullable: true
          description: >-
            Binding de anime da pasta, quando houver. Enriquecido só na listagem
            (`GET /folders`); `null` nas leituras que não computam esse campo.

    MediaFolderPage:
      description: Envelope paginado de pastas
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/MediaFolderResponse'

    VideoFileRequest:
      type: object
      description: |
        Payload de criação e atualização de arquivo. O `path` é derivado server-side a
        partir da pasta pai + `name`.
      required: [folderId, name]
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'
        name:
          type: string
          minLength: 1
          description: Nome do arquivo (último segmento do path)
        sizeBytes:
          allOf: [{ $ref: '#/components/schemas/FileSizeBytes' }]
          nullable: true
          description: Tamanho em bytes; `null` quando o provider não expõe
        format:
          allOf: [{ $ref: '#/components/schemas/FileFormat' }]
          nullable: true
          description: '`null` se não detectado'

    VideoFileResponse:
      type: object
      description: Vista pública de um arquivo ingerido
      required: [id, folderId, name, path, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/FileId'
        folderId:
          $ref: '#/components/schemas/FolderId'
        name:
          type: string
        path:
          type: string
        sizeBytes:
          allOf: [{ $ref: '#/components/schemas/FileSizeBytes' }]
          nullable: true
        format:
          allOf: [{ $ref: '#/components/schemas/FileFormat' }]
          nullable: true
        createdAt:
          type: string
          format: date-time
        tmdbPairing:
          allOf: [{ $ref: '#/components/schemas/TmdbFilePairingResponse' }]
          nullable: true
          description: >-
            Pairing TMDB do arquivo, quando houver. Enriquecido só na listagem
            (`GET /video-files`); `null` nas leituras que não computam esse campo.
        watchProgress:
          allOf: [{ $ref: '#/components/schemas/WatchProgress' }]
          nullable: true
          description: >-
            Progresso do usuário no arquivo. Preenchido só na listagem de episódios do anime
            com `userId`; `null` nas demais leituras e em arquivo que o usuário nunca abriu.

    VideoFilePage:
      description: Envelope paginado de arquivos
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/VideoFileResponse'

    FileSizeBytes:
      type: integer
      format: int64
      description: Tamanho de arquivo em bytes

    FileFormat:
      type: string
      description: 'Extensão/formato do arquivo (ex.: `mkv`, `mp4`)'

    # ---------- cache ----------
    CacheStatus:
      type: string
      description: Estado da linha no ciclo de download
      enum:
        - QUEUED
        - DOWNLOADING
        - COMPLETED
        - FAILED

    PendingOnlyFilter:
      type: boolean
      description: Restringe às linhas com status diferente de `COMPLETED`

    CacheQueueRequest:
      type: object
      description: Pedido de enfileiramento de download
      required: [fileId]
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'

    CacheItemId:
      type: string
      format: uuid
      description: |
        Id da linha do cache, gerado ao enfileirar — também é o nome do arquivo em disco.
        Reenfileirar um item `FAILED` reaproveita o mesmo id.

    CacheItem:
      type: object
      description: Linha do cache com o arquivo resolvido
      required: [id, status, queuedAt]
      properties:
        id:
          $ref: '#/components/schemas/CacheItemId'
        status:
          $ref: '#/components/schemas/CacheStatus'
        jobId:
          type: integer
          format: int64
          nullable: true
          description: Id do job rclone; `null` fora de `DOWNLOADING`
        queuedAt:
          type: string
          format: date-time
          description: Momento em que a linha entrou na fila
        videoFile:
          allOf: [{ $ref: '#/components/schemas/VideoFileResponse' }]
          nullable: true
          description: Arquivo do catalog a que a linha se refere

    CacheItemPage:
      description: Envelope paginado das linhas do cache
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CacheItem'

    CacheEventType:
      type: string
      description: |
        Tipo de um evento do stream SSE `GET /v1/cache/events`. É também o `event:` (nome) da
        mensagem SSE, então o cliente pode tanto registrar um listener por nome
        (`addEventListener('PROGRESS', ...)`) quanto ler o campo `type` do payload.

        - `SNAPSHOT` — primeiro evento de quem se inscreve com algo ativo na fila: traz em
          `items` as linhas `QUEUED`/`DOWNLOADING` daquele momento. A conexão continua aberta.
        - `IDLE` — não há nada ativo na fila. Enviado como primeiro (e único) evento de quem se
          inscreve com a fila vazia, ou a todos os inscritos quando a fila termina de drenar. O
          servidor **fecha a conexão logo depois** — o cliente não deve reconectar sozinho, só
          quando voltar a ter algo a acompanhar (ex.: depois de um `POST` que enfileira).
        - `QUEUED` — uma linha entrou na fila (nova, ou reaproveitada de um `FAILED`).
        - `STARTED` — uma linha começou a baixar.
        - `PROGRESS` — progresso periódico do download em andamento.
        - `COMPLETED` — uma linha terminou de baixar; o arquivo já pode tocar.
        - `FAILED` — uma linha falhou (erro do rclone, ou arquivo removido do catalog antes do
          início); pode ser reenfileirada.
        - `EVICTED` — uma linha foi removida pela eviction LRU pra abrir espaço a outro
          download.
        - `CANCELLED` — uma linha `QUEUED`/`DOWNLOADING` foi cancelada e removida.
        - `DELETED` — uma linha `COMPLETED` teve o arquivo apagado manualmente e foi removida.
      enum:
        - SNAPSHOT
        - IDLE
        - QUEUED
        - STARTED
        - PROGRESS
        - COMPLETED
        - FAILED
        - EVICTED
        - CANCELLED
        - DELETED

    CacheEvent:
      type: object
      description: |
        Payload (`data:`, JSON) de cada mensagem do stream SSE `GET /v1/cache/events` — o
        endpoint não é descrito em `paths` (Server-Sent Events não é modelável pelo gerador
        `jaxrs-spec`), só este payload.

        O stream é aberto com `EventSource` (`GET`, `Accept: text/event-stream`) e acompanha a
        fila do cache em tempo real. Cada mensagem tem `event:` igual ao `type` e o `data:` com
        este objeto. Os campos preenchidos dependem do `type`; os demais vêm `null`:

        | `type` | Campos preenchidos |
        |---|---|
        | `SNAPSHOT` | `items` |
        | `IDLE` | nenhum |
        | `QUEUED` | `id`, `status` = `QUEUED` |
        | `STARTED` | `id`, `status` = `DOWNLOADING` |
        | `PROGRESS` | `id`, `status` = `DOWNLOADING`, `bytes`, `totalBytes`, `speed`, `eta`, `percentage` |
        | `COMPLETED` | `id`, `status` = `COMPLETED` |
        | `FAILED` | `id`, `status` = `FAILED`, `errorMessage` |
        | `EVICTED` / `CANCELLED` / `DELETED` | `id` (a linha já não existe mais) |

        Pra acompanhar um arquivo específico, correlacione o `id` com o `cacheItemId` de
        `GET /v1/playback/files/{fileId}/availability` ou com o `id` devolvido ao enfileirar.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/CacheEventType'
        id:
          allOf: [{ $ref: '#/components/schemas/CacheItemId' }]
          nullable: true
          description: |
            Linha do cache a que o evento se refere; `null` em `SNAPSHOT` e `IDLE`
        status:
          allOf: [{ $ref: '#/components/schemas/CacheStatus' }]
          nullable: true
          description: |
            Status da linha no momento do evento; `null` em `SNAPSHOT`, `IDLE`, `EVICTED`,
            `CANCELLED` e `DELETED`
        errorMessage:
          type: string
          nullable: true
          description: Motivo da falha, pronto pra exibir; só preenchido em `FAILED`
        bytes:
          type: integer
          format: int64
          nullable: true
          description: Bytes já transferidos; só preenchido em `PROGRESS`
        totalBytes:
          type: integer
          format: int64
          nullable: true
          description: Total esperado de bytes; só preenchido em `PROGRESS`
        speed:
          type: number
          format: double
          nullable: true
          description: Velocidade instantânea, em bytes por segundo; só preenchido em `PROGRESS`
        eta:
          type: integer
          format: int64
          nullable: true
          description: |
            Segundos restantes estimados; só em `PROGRESS`, e mesmo nele pode vir `null`
            enquanto o rclone ainda não consegue estimar
        percentage:
          type: number
          format: double
          nullable: true
          description: Percentual concluído, de `0.0` a `100.0`; só preenchido em `PROGRESS`
        items:
          type: array
          nullable: true
          description: |
            Linhas `QUEUED`/`DOWNLOADING` no momento da inscrição; só preenchido em `SNAPSHOT`
          items:
            $ref: '#/components/schemas/CacheItem'

    # ---------- mediaprobe ----------
    MediaContainer:
      type: object
      description: Metadados do container (bloco `format` do ffprobe)
      properties:
        formatName:
          type: string
          nullable: true
          description: >-
            Nome curto do formato no ffprobe (ex.: `matroska,webm`, `mov,mp4,m4a,3gp,3g2,mj2`)
        formatLongName:
          type: string
          nullable: true
          description: 'Nome legível do formato (ex.: `Matroska / WebM`)'
        durationSeconds:
          type: number
          format: double
          nullable: true
          description: Duração total da mídia, em segundos
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: Tamanho do arquivo, em bytes
        bitRate:
          type: integer
          format: int64
          nullable: true
          description: Bitrate total do container, em bits por segundo

    VideoTrack:
      type: object
      description: Faixa de vídeo
      properties:
        index:
          $ref: '#/components/schemas/StreamIndex'
        codec:
          type: string
          nullable: true
          description: 'Codec no nome do ffprobe (ex.: `h264`, `hevc`, `av1`)'
        width:
          type: integer
          format: int32
          nullable: true
          description: Largura, em pixels
        height:
          type: integer
          format: int32
          nullable: true
          description: Altura, em pixels
        displayAspectRatio:
          type: string
          nullable: true
          description: 'Proporção de exibição (ex.: `16:9`)'
        sampleAspectRatio:
          type: string
          nullable: true
          description: >-
            Proporção de aspecto da amostra/pixel (ex.: `1:1` pixel quadrado, `4:3` anamórfico).
            Diferente de `1:1` indica vídeo anamórfico — `width`x`height` não reflete a proporção
            de exibição, só `displayAspectRatio` reflete
        frameRate:
          type: number
          format: double
          nullable: true
          description: >-
            Quadros por segundo, calculado do `avg_frame_rate` do ffprobe (ex.: `23.976`)
        bitRate:
          type: integer
          format: int64
          nullable: true
          description: >-
            Bitrate da faixa, em bits por segundo; `null` quando o container não informa por faixa
        pixFmt:
          type: string
          nullable: true
          description: 'Formato de pixel (ex.: `yuv420p`, `yuv420p10le`)'
        profile:
          type: string
          nullable: true
          description: 'Profile do codec (ex.: `High`, `Main 10`)'
        language:
          $ref: '#/components/schemas/TrackLanguage'
        title:
          $ref: '#/components/schemas/TrackTitle'
        defaultTrack:
          $ref: '#/components/schemas/TrackDefault'

    AudioTrack:
      type: object
      description: |
        Faixa de áudio. A posição dela no array `audio` (0-based) é o valor a mandar em
        `audioTrackIndex` ao iniciar uma sessão de playback — **não** o campo `index`.
      properties:
        index:
          $ref: '#/components/schemas/StreamIndex'
        codec:
          type: string
          nullable: true
          description: 'Codec no nome do ffprobe (ex.: `aac`, `flac`, `opus`)'
        channels:
          type: integer
          format: int32
          nullable: true
          description: Número de canais
        channelLayout:
          type: string
          nullable: true
          description: 'Layout dos canais (ex.: `stereo`, `5.1`)'
        sampleRate:
          type: integer
          format: int32
          nullable: true
          description: Taxa de amostragem, em Hz
        bitRate:
          type: integer
          format: int64
          nullable: true
          description: >-
            Bitrate da faixa, em bits por segundo; `null` quando o container não informa por faixa
        language:
          $ref: '#/components/schemas/TrackLanguage'
        title:
          $ref: '#/components/schemas/TrackTitle'
        defaultTrack:
          $ref: '#/components/schemas/TrackDefault'

    SubtitleTrack:
      type: object
      description: |
        Faixa de legenda. A posição dela no array `subtitles` (0-based) é o valor a mandar em
        `subtitleTrackIndex` ao iniciar uma sessão de playback — **não** o campo `index`.
      properties:
        index:
          $ref: '#/components/schemas/StreamIndex'
        codec:
          type: string
          nullable: true
          description: |
            Codec no nome do ffprobe (ex.: `subrip`, `ass`, `hdmv_pgs_subtitle`). No playback,
            `subrip`/`srt` vira legenda soft (WebVTT); os demais formatos de texto (ex.: `ass`)
            são queimados no vídeo via libass; formatos de imagem (`hdmv_pgs_subtitle`,
            `dvd_subtitle`, `dvb_subtitle`) são queimados via overlay do próprio stream de
            legenda decodificado.
        language:
          $ref: '#/components/schemas/TrackLanguage'
        title:
          $ref: '#/components/schemas/TrackTitle'
        defaultTrack:
          $ref: '#/components/schemas/TrackDefault'
        forced:
          type: boolean
          nullable: true
          description: >-
            `true` se a faixa é "forçada" (só traduz falas em outro idioma ou letreiros)
        hearingImpaired:
          type: boolean
          nullable: true
          description: >-
            `true` se a faixa é para deficientes auditivos (SDH/CC — descreve sons além das falas)

    Chapter:
      type: object
      description: |
        Capítulo do arquivo, na ordem em que o ffprobe os lista — exatamente como estão
        gravados, sem fundir, reordenar ou corrigir sobreposições (arquivos diferentes podem
        ter capítulos que se sobrepõem).
      required: [startSeconds, endSeconds]
      properties:
        startSeconds:
          type: number
          format: double
          description: Instante de início do capítulo, em segundos
        endSeconds:
          type: number
          format: double
          description: Instante de fim do capítulo, em segundos
        title:
          type: string
          nullable: true
          description: 'Tag `title` do capítulo (ex.: `Abertura`, `Parte A`); `null` se ausente'

    StreamIndex:
      type: integer
      format: int32
      description: |
        Índice global do stream no arquivo (campo `index` do ffprobe), contando todos os tipos.
        Serve para identificar a faixa; para escolher faixas no playback use a posição no array.

    TrackLanguage:
      type: string
      nullable: true
      description: >-
        Tag `language` do arquivo, normalmente ISO 639-2 (ex.: `jpn`, `eng`); `null` se ausente

    TrackTitle:
      type: string
      nullable: true
      description: 'Tag `title` do arquivo (ex.: `Japanese 5.1`); `null` se ausente'

    TrackDefault:
      type: boolean
      nullable: true
      description: '`true` se a faixa está marcada como padrão no arquivo'

    MediaInfoResponse:
      type: object
      description: Metadados técnicos da mídia, com as faixas separadas por tipo na ordem do arquivo
      required: [container, video, audio, subtitles, chapters]
      properties:
        container:
          $ref: '#/components/schemas/MediaContainer'
        video:
          type: array
          items:
            $ref: '#/components/schemas/VideoTrack'
        audio:
          type: array
          items:
            $ref: '#/components/schemas/AudioTrack'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleTrack'
        chapters:
          type: array
          description: Capítulos do arquivo, na ordem do arquivo; lista vazia se não houver
          items:
            $ref: '#/components/schemas/Chapter'

    # ---------- playback ----------
    SessionId:
      type: string
      format: uuid
      description: Identificador da sessão de playback

    TranscodeProfile:
      type: string
      description: |
        Profile de transcode suportado pelo backend. Fixo no código (não configurável via
        `Setting`): `WEB` (navegador, hls.js), `TV` (TV/set-top box genérica), `MOBILE`
        (dispositivo móvel), `GOOGLE_TV_STREAMER` (Google TV Streamer — H.264 até o nível 5.2,
        HEVC Main/Main10 até o nível 5.1 ou AV1 Main até o nível 5.1, cap de 4K/60fps, áudio
        AAC). `WEB`/`TV`/`MOBILE` resolvem pra mesma estratégia de transcode internamente (sem
        diferenciação real de comportamento ainda); `GOOGLE_TV_STREAMER` tem estratégia própria.
        O valor correto é o que descreve o dispositivo do cliente.
      enum:
        - WEB
        - TV
        - MOBILE
        - GOOGLE_TV_STREAMER

    FileAvailabilityStatus:
      type: string
      description: O que falta, se algo, antes de iniciar uma sessão de playback pro arquivo
      enum:
        - READY
        - NEEDS_DOWNLOAD
        - DOWNLOADING

    FileAvailabilityResponse:
      type: object
      description: Disponibilidade de um arquivo pra iniciar uma sessão de playback
      required: [fileId, status]
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
        status:
          $ref: '#/components/schemas/FileAvailabilityStatus'
        cacheItemId:
          allOf: [{ $ref: '#/components/schemas/CacheItemId' }]
          nullable: true
          description: >-
            Id da linha do cache, pra correlacionar com o SSE de `/v1/cache/events`; `null` pra
            provider `LOCAL` ou quando ainda não existe linha (`NEEDS_DOWNLOAD` sem download
            nunca tentado)

    StartPlaybackSessionRequest:
      type: object
      description: Parâmetros para iniciar uma sessão de transcode
      required: [fileId, profile]
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
        profile:
          $ref: '#/components/schemas/TranscodeProfile'
        audioTrackIndex:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Posição (0-based) da faixa no array `audio` do `GET /v1/mediaprobe/files/{fileId}` —
            **não** o campo `index` da faixa, que é o índice global do stream no arquivo.

            Ausente/`null` usa o áudio padrão das preferências: a primeira faixa no idioma
            `playback.default.audio-language`; sem faixa nesse idioma, a marcada como padrão no
            arquivo, senão a primeira.
        subtitleTrackIndex:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Posição (0-based) da faixa no array `subtitles` do `GET /v1/mediaprobe/files/{fileId}`
            — **não** o campo `index` da faixa. Legendas SRT viram faixa WebVTT soft
            (selecionável no player); ASS e demais formatos são queimados no vídeo (hardsub).

            Ausente/`null` usa a legenda padrão das preferências: a primeira faixa no idioma
            `playback.default.subtitle-language`, forçada ou completa conforme
            `playback.default.subtitle-forced` (forçada = flag `forced` do arquivo ou título com
            `forced`, `forçada`, `forcada`, `signs` ou `songs`, sem diferenciar maiúsculas); sem
            faixa desse tipo, a primeira do idioma; sem faixa no idioma, ou com
            `playback.default.subtitle-language` vazio, reproduz sem legenda. Para reproduzir sem
            legenda, use `subtitleDisabled`.
        subtitleDisabled:
          type: boolean
          default: false
          description: |
            `true` reproduz sem legenda, ignorando `subtitleTrackIndex` e a legenda padrão das
            preferências.
        userId:
          allOf: [{ $ref: '#/components/schemas/UserId' }]
          nullable: true
          description: |
            Usuário que está assistindo. Com ele, a posição enviada nos heartbeats da sessão vira
            o progresso do arquivo no histórico do usuário; sem ele, a sessão não grava
            histórico. Responde `404` se o usuário não existir.

    SeekRequest:
      type: object
      description: Nova posição do transcode
      required: [positionSeconds]
      properties:
        positionSeconds:
          type: number
          format: double
          minimum: 0
          description: Instante alvo, em segundos a partir do início da mídia

    SwitchTracksRequest:
      type: object
      description: Nova posição e faixas de áudio/legenda do transcode
      required: [positionSeconds, audioTrackIndex]
      properties:
        positionSeconds:
          type: number
          format: double
          minimum: 0
          description: Instante alvo, em segundos a partir do início da mídia
        audioTrackIndex:
          type: integer
          format: int32
          minimum: 0
          description: |
            Posição (0-based) da faixa no array `audio` do `GET /v1/mediaprobe/files/{fileId}` —
            **não** o campo `index` da faixa. Obrigatório aqui: a troca de faixas não usa as
            preferências `playback.default.*`.
        subtitleTrackIndex:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Posição (0-based) da faixa no array `subtitles` do `GET /v1/mediaprobe/files/{fileId}`
            — **não** o campo `index` da faixa. Ausente/`null` reproduz sem legenda — diferente
            do `StartPlaybackSessionRequest`, aqui não há legenda padrão.

    PlaybackSessionResponse:
      type: object
      description: Sessão de playback recém-iniciada ou reposicionada
      required: [sessionId, playlistUrl, startOffsetSeconds, audioTrackIndex]
      properties:
        sessionId:
          $ref: '#/components/schemas/SessionId'
        audioTrackIndex:
          type: integer
          format: int32
          minimum: 0
          description: |
            Faixa de áudio ativa na sessão — posição (0-based) no array `audio` do
            `GET /v1/mediaprobe/files/{fileId}`. É a faixa pedida pelo cliente ou, quando o
            request não informou, a padrão das preferências.
        subtitleTrackIndex:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Faixa de legenda ativa na sessão — posição (0-based) no array `subtitles` do
            `GET /v1/mediaprobe/files/{fileId}`; `null` = sem legenda. É a faixa pedida pelo
            cliente ou, quando o request não informou, a padrão das preferências.
        playlistUrl:
          type: string
          description: |
            URL (relativa ao host) da playlist `m3u8` da sessão — atalho para o endpoint
            `GET /v1/playback/sessions/{sessionId}/playlist.m3u8`.
        startOffsetSeconds:
          type: number
          format: double
          minimum: 0
          description: |
            Posição de mídia, em segundos, que corresponde ao início da playlist (`currentTime 0`). O
            cliente mapeia a posição local com base nela (`currentTime = alvo - startOffsetSeconds`) e
            recarrega a source quando ela muda entre chamadas de seek (indicando que o transcode
            reiniciou num novo offset). `0` no início da mídia. Quando o reinício (seek ou troca de
            faixas) copia o vídeo sem recodificar, o transcode só consegue começar num keyframe:
            o valor é o instante desse keyframe, em ou antes da posição pedida (podendo ficar até
            um GOP, alguns segundos, antes), e não a própria posição. Recodificando, é a posição
            pedida.

    M3u8Playlist:
      type: string
      description: Conteúdo da playlist HLS (`m3u8`) em texto

    MediaFileName:
      type: string
      description: |
        Nome de um arquivo HLS da sessão. Formatos aceitos:

        - `segment_N.ts` / `segment_N.m4s` — segmento da rendition única (MPEG-TS ou fMP4);
        - `segment_V_N.ts` / `segment_V_N.m4s` — segmento da variante `V` (ABR ou legenda soft);
        - `init.mp4` — init segment fMP4 (via `#EXT-X-MAP`);
        - `stream_V.m3u8` — variant playlist da variante `V`;
        - `stream_V_vtt.m3u8` — playlist da rendition de legenda WebVTT;
        - `stream_VN.vtt` — segmento de legenda WebVTT.

        Nome fora desses formatos responde `404` (não `400`) — por isso não há `pattern` aqui.
      example: segment_0.ts

    MediaFileContent:
      type: string
      format: binary
      description: |
        Bytes de um arquivo HLS da sessão (segmento `.ts`/`.m4s`, init segment `.mp4`, playlist
        `.m3u8` ou legenda `.vtt`)

    SessionHeartbeat:
      type: object
      description: Validade da sessão após o heartbeat
      required: [expiresInSeconds]
      properties:
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 0
          description: |
            Segundos restantes até a sessão expirar caso nenhum novo heartbeat chegue. O cliente
            deve pingar novamente antes disso.

    # ---------- anilist ----------
    AnilistFormat:
      type: string
      description: |
        Formato/tipo do anime na AniList (campo `Media.format`). `UNKNOWN` cobre valores que a
        AniList venha a adicionar.
      enum:
        - TV
        - TV_SHORT
        - MOVIE
        - SPECIAL
        - OVA
        - ONA
        - MUSIC
        - UNKNOWN

    AnilistSeason:
      type: string
      description: Estação de estreia do anime (campo `Media.season`)
      enum:
        - WINTER
        - SPRING
        - SUMMER
        - FALL
        - UNKNOWN

    AnilistTitle:
      type: object
      description: |
        Bloco de títulos da AniList — 4 variantes coexistem. Campo `native` da AniList é
        renomeado para `nativeTitle` no JSON porque colide com palavra reservada.
      properties:
        romaji:
          type: string
          nullable: true
          description: Romanização; convenção AniList quando não há preferência
        english:
          type: string
          nullable: true
        nativeTitle:
          type: string
          nullable: true
          description: Título em japonês (kanji/kana)
        userPreferred:
          type: string
          nullable: true
          description: Título preferido do usuário logado; sem token, coincide com `romaji`

    AnilistCoverImage:
      type: object
      description: URLs de poster em 3 resoluções (cada campo pode ser `null`)
      properties:
        medium:
          type: string
          nullable: true
          description: URL da imagem em tamanho pequeno (~100×145)
        large:
          type: string
          nullable: true
          description: URL da imagem em tamanho médio (~230×340)
        extraLarge:
          type: string
          nullable: true
          description: URL da imagem em tamanho grande (~460×645)

    AnilistFuzzyDate:
      type: object
      description: Data parcial — qualquer componente pode ser `null` quando desconhecido
      properties:
        year:
          type: integer
          format: int32
          nullable: true
        month:
          type: integer
          format: int32
          nullable: true
        day:
          type: integer
          format: int32
          nullable: true

    AnilistMediaSummary:
      type: object
      description: |
        Shape reduzido de `Media` para o endpoint de search — omite `relations` para evitar
        payload grande (as relações de cada item). A chave pública é o `anilistId`, a mesma usada
        pelo `animemetadata`.
      required: [anilistId]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        malId:
          type: integer
          format: int32
          nullable: true
          description: Id correspondente do anime no MyAnimeList, quando a AniList souber o match
        title:
          allOf: [{ $ref: '#/components/schemas/AnilistTitle' }]
          nullable: true
        synonyms:
          type: array
          description: Lista de sinônimos
          items:
            type: string
        coverImage:
          allOf: [{ $ref: '#/components/schemas/AnilistCoverImage' }]
          nullable: true
        description:
          type: string
          nullable: true
          description: Sinopse em HTML (mesma convenção do site AniList)
        episodes:
          type: integer
          format: int32
          nullable: true
          description: Total de episódios; `null` para animes em exibição sem previsão
        duration:
          type: integer
          format: int32
          nullable: true
          description: Duração média por episódio em minutos
        startDate:
          allOf: [{ $ref: '#/components/schemas/AnilistFuzzyDate' }]
          nullable: true
        endDate:
          allOf: [{ $ref: '#/components/schemas/AnilistFuzzyDate' }]
          nullable: true
          description: Data de término; `null` enquanto o anime não terminou
        status:
          type: string
          nullable: true
          description: Status bruto da AniList (`FINISHED`, `RELEASING`, `NOT_YET_RELEASED`, `CANCELLED`, `HIATUS`)
        seasonYear:
          type: integer
          format: int32
          nullable: true
          description: Ano da estação de estreia; mais confiável que `startDate.year`
        format:
          allOf: [{ $ref: '#/components/schemas/AnilistFormat' }]
          nullable: true
        season:
          allOf: [{ $ref: '#/components/schemas/AnilistSeason' }]
          nullable: true
        averageScore:
          type: integer
          format: int32
          nullable: true
          description: Nota média ponderada em escala 0–100
        meanScore:
          type: integer
          format: int32
          nullable: true
          description: Média simples das notas em escala 0–100
        popularity:
          type: integer
          format: int32
          nullable: true
          description: Quantidade de usuários da AniList com o anime na lista
        isAdult:
          type: boolean
          nullable: true
          description: Flag NSFW derivada do `isAdult` da AniList
        genres:
          type: array
          description: Nomes de gêneros
          items:
            type: string
        tags:
          type: array
          nullable: true
          description: Tags da AniList, com relevância e marcação de spoiler
          items:
            $ref: '#/components/schemas/AnimeTagResponse'
        studio:
          type: string
          nullable: true
          description: Estúdio principal responsável pela produção, segundo a AniList

    AnilistMediaSummaryPage:
      description: Envelope paginado dos resultados de busca
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AnilistMediaSummary'

    # ---------- tmdb ----------
    Language:
      type: string
      description: Tag de idioma BCP 47 (idioma ISO 639-1 + região ISO 3166-1)

    GenreId:
      type: integer
      format: int32
      description: Id de gênero no TMDB (não expandido)

    Popularity:
      type: number
      format: double
      description: Métrica de popularidade

    VoteAverage:
      type: number
      format: double
      description: Nota média (0–10)

    VoteCount:
      type: integer
      format: int32
      description: Total de votos

    LanguageCode:
      type: string
      description: Código de idioma ISO 639-1

    ImageUrl:
      type: string
      description: >-
        URL absoluta da imagem no CDN do TMDB, já montada pelo módulo (base + tamanho). Pronta para
        uso direto — o consumidor não completa nada.

    TmdbMovieSearchResult:
