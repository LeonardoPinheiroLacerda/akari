    # ---------- animemetadata ----------
    GraphDepth:
      type: integer
      format: int32
      default: 3
      description: Profundidade máxima da BFS de relações

    TmdbMediaType:
      type: string
      description: Discriminador do binding TMDB — `TV` (série) ou `MOVIE` (filme).
      enum:
        - TV
        - MOVIE

    AnimeBindingRequest:
      type: object
      description: Payload de binding anime↔pasta
      required: [folderId]
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'

    AnimeReviewStatus:
      type: string
      description: |
        Estado de revisão de um anime. `PENDING_REVIEW` e `PARTIAL` são gravados ao fim da tarefa
        de ingestão da pasta; `REVIEWED`, pela confirmação manual. `null` enquanto a pasta não
        terminou uma ingestão.
        - `PENDING_REVIEW`: a tarefa terminou com todos os steps e o vínculo está completo —
          filme, ou série com todos os arquivos pareados —, aguardando confirmação manual.
        - `PARTIAL`: vínculo incompleto (tarefa parada em curadoria ou com falha, ou série com
          algum arquivo sem par) — precisa de atenção.
        - `REVIEWED`: confirmado manualmente; nenhum recálculo automático sobrescreve esse
          estado.
      enum:
        - PENDING_REVIEW
        - PARTIAL
        - REVIEWED

    AnimeTitlesResponse:
      type: object
      description: Títulos localizados
      properties:
        main:
          type: string
          nullable: true
          description: Título principal
        english:
          type: string
          nullable: true
        japanese:
          type: string
          nullable: true
        synonyms:
          type: array
          nullable: true
          items:
            type: string

    AnimeThumbnailsResponse:
      type: object
      description: URLs de poster em 3 resoluções
      properties:
        small:
          type: string
          nullable: true
        medium:
          type: string
          nullable: true
        large:
          type: string
          nullable: true

    AnimeBindingSummary:
      type: object
      description: |
        Resumo leve do binding de uma pasta — o suficiente para o card do catálogo
        (status vinculado + capa + título). Para a vista completa use o `AnimeResponse`.
      required: [folderId, anilistId]
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        malId:
          type: integer
          format: int32
          nullable: true
          description: Id correspondente do anime no MyAnimeList, quando a AniList souber o match
        title:
          type: string
          nullable: true
          description: Título principal
        thumbnail:
          type: string
          nullable: true
          description: URL do poster (resolução média)
        year:
          type: integer
          format: int32
          nullable: true
        format:
          type: string
          nullable: true
          description: Formato (`TV`, `MOVIE`, `OVA`, ...)
        studio:
          type: string
          nullable: true
          description: Estúdio principal responsável pela produção, segundo a AniList
        hasTmdb:
          type: boolean
          nullable: true
          description: '`true` se o anime também tem binding TMDB'

    AnimeResponse:
      type: object
      description: |
        Vista pública de um anime. `banner`/`logo` só são preenchidos quando há binding TMDB e
        um override de imagem gravado — o bind não escolhe imagem. `synopsis` vem em HTML quando a fonte é AniList (pode
        conter `<br>`, `<i>`, `<b>`).
      required: [anilistId, franchiseAssignment]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        malId:
          type: integer
          format: int32
          nullable: true
          description: Id correspondente do anime no MyAnimeList, quando a AniList souber o match
        titles:
          allOf: [{ $ref: '#/components/schemas/AnimeTitlesResponse' }]
          nullable: true
        synopsis:
          type: string
          nullable: true
          description: Sinopse em HTML
        thumbnails:
          allOf: [{ $ref: '#/components/schemas/AnimeThumbnailsResponse' }]
          nullable: true
        banner:
          type: string
          nullable: true
          description: Backdrop; URL absoluta quando há override manual
        logo:
          type: string
          nullable: true
          description: Logo; URL absoluta quando há override manual
        episodes:
          type: integer
          format: int32
          nullable: true
        duration:
          type: string
          nullable: true
          description: Duração média por episódio (formato livre)
        year:
          type: integer
          format: int32
          nullable: true
        format:
          type: string
          nullable: true
          description: Formato do anime (`TV`, `MOVIE`, `OVA`, ...)
        season:
          type: string
          nullable: true
          description: Estação de estreia (`WINTER`, `SPRING`, ...)
        studio:
          type: string
          nullable: true
          description: Estúdio principal responsável pela produção, segundo a AniList
        score:
          type: number
          format: double
          nullable: true
          description: Nota média em escala 0–10
        isAdult:
          type: boolean
          nullable: true
          description: Flag NSFW
        genres:
          type: array
          nullable: true
          items:
            type: string
        tags:
          type: array
          nullable: true
          description: Tags da AniList, com relevância e marcação de spoiler
          items:
            $ref: '#/components/schemas/AnimeTagResponse'
        startDate:
          allOf: [{ $ref: '#/components/schemas/AnilistFuzzyDate' }]
          nullable: true
          description: Data de estreia segundo a AniList
        endDate:
          allOf: [{ $ref: '#/components/schemas/AnilistFuzzyDate' }]
          nullable: true
          description: Data de término segundo a AniList; `null` enquanto o anime não terminou
        status:
          type: string
          nullable: true
          description: Status bruto da AniList (`FINISHED`, `RELEASING`, `NOT_YET_RELEASED`, `CANCELLED`, `HIATUS`)
        popularity:
          type: integer
          format: int32
          nullable: true
          description: Quantidade de usuários da AniList com o anime na lista
        meanScore:
          type: number
          format: double
          nullable: true
          description: Média simples das notas na AniList, em escala 0–10 (`score` é a média ponderada)
        franchiseAssignment:
          $ref: '#/components/schemas/FranchiseAssignment'
        franchiseRootId:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          nullable: true
          description: |
            Raiz da franquia à qual o anime pertence (`franchiseOf`); `null` se está fora de
            qualquer franquia (oculto, direto ou por herança)
        reviewStatus:
          allOf: [{ $ref: '#/components/schemas/AnimeReviewStatus' }]
          nullable: true
          description: '`null` até o anime ser confirmado manualmente'

    AnimeTagResponse:
      type: object
      description: Tag da AniList atribuída ao anime
      required: [name]
      properties:
        name:
          type: string
        rank:
          type: integer
          format: int32
          nullable: true
          description: Quanto a tag se aplica ao anime, de 0 a 100
        isSpoiler:
          type: boolean
          nullable: true
          description: '`true` se a tag revela parte da história'

    AnimePage:
      description: Envelope paginado de animes
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AnimeResponse'

    AnimeRelationNode:
      type: object
      description: Vértice do grafo (payload minimalista para o front)
      required: [anilistId, rootKind]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        malId:
          type: integer
          format: int32
          nullable: true
          description: Id correspondente do anime no MyAnimeList, quando a AniList souber o match
        title:
          type: string
          nullable: true
          description: Título principal
        posterUrl:
          type: string
          nullable: true
          description: URL do poster (thumbnail)
        folderId:
          allOf: [{ $ref: '#/components/schemas/FolderId' }]
          nullable: true
        rootKind:
          allOf: [{ $ref: '#/components/schemas/AnimeRootKind' }]
          description: >-
            Classificação de raiz já decidida no backend pela organização em franquias. A
            atribuição crua (`franchiseAssignment`) vive no detalhe do anime, não no nó do grafo.

    AnimeRootKind:
      type: string
      description: >-
        Tipo de raiz de franquia resolvido no backend (regras em `GET
        /v1/metadata/franchises`). `MANUAL` = raiz de uma franquia manual; `NATURAL` = raiz que
        não foi criada à mão (anime `AUTO` sem pai automático, ou onde a subida detectou um
        ciclo); `NOT_ROOT` = não é raiz (pertence à franquia de outro anime, ou está fora de
        qualquer franquia).
      enum:
        - MANUAL
        - NATURAL
        - NOT_ROOT

    AnimeRelationEdge:
      type: object
      description: Aresta do grafo
      required: [from, to]
      properties:
        from:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          description: '`anilistId` de origem'
        to:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          description: '`anilistId` de destino'
        relationType:
          type: string
          nullable: true
          description: 'Nome do enum (ex.: `SEQUEL`, `PREQUEL`)'

    AnimeRelationGraphResponse:
      type: object
      description: Grafo materializado a partir de um anime raiz
      required: [rootAnilistId]
      properties:
        rootAnilistId:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          description: '`anilistId` que ancorou a busca'
        nodes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AnimeRelationNode'
        edges:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AnimeRelationEdge'

    AnimeFranchiseResponse:
      type: object
      description: |
        Franquia de um anime já organizada pelo backend em raiz/temporadas/especiais — o
        front só exibe as listas na ordem recebida, sem agrupar ou reordenar.
      required: [root]
      properties:
        root:
          allOf: [{ $ref: '#/components/schemas/AnimeResponse' }]
          description: Raiz da franquia, mesmo quando o anime consultado é outra temporada
        seasons:
          type: array
          nullable: true
          description: |
            A raiz mais a cadeia de `SEQUEL` a partir dela entre os membros, na ordem da cadeia,
            só com formato de série (`TV`, `TV_SHORT`, `ONA`)
          items:
            $ref: '#/components/schemas/AnimeResponse'
        movies:
          type: array
          nullable: true
          description: |
            Membros fora de `seasons` com formato `MOVIE`. Ordenados por `year`/`season`
          items:
            $ref: '#/components/schemas/AnimeResponse'
        specials:
          type: array
          nullable: true
          description: |
            Membros fora de `seasons` de qualquer outro formato (`OVA`, `SPECIAL`, `TV` fora da
            cadeia, ...). Ordenados por `year`/`season`
          items:
            $ref: '#/components/schemas/AnimeResponse'
        inWatchlist:
          type: boolean
          nullable: true
          description: |
            Se o anime consultado (o `anilistId` da rota, não necessariamente a raiz) está na
            lista do usuário. Só preenchido com `userId`; `null` sem ele.

    FranchiseAssignment:
      type: string
      description: |
        Atribuição de franquia de um anime — como ele foi posicionado. `AUTO` = pela regra
        automática (pai automático); `MANUAL_MEMBER` = posto à mão na franquia de uma raiz;
        `MANUAL_ROOT` = raiz de uma franquia criada à mão; `HIDDEN` = oculto, fora de qualquer
        franquia — os clientes não o listam.
      enum:
        - AUTO
        - MANUAL_MEMBER
        - MANUAL_ROOT
        - HIDDEN

    FranchiseKind:
      type: string
      description: |
        Tipo de raiz. `MANUAL` = franquia criada à mão (`POST /v1/metadata/franchises`);
        `NATURAL` = as demais raízes.
      enum:
        - NATURAL
        - MANUAL

    AnimeFranchiseAssignmentRequest:
      type: object
      description: Nova atribuição de franquia do anime
      required: [assignment]
      properties:
        assignment:
          $ref: '#/components/schemas/FranchiseAssignment'
        rootId:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          nullable: true
          description: Raiz de destino. Obrigatório com `MANUAL_MEMBER` e proibido nos outros valores

    CreateFranchiseRequest:
      type: object
      description: Anime que vira raiz da nova franquia manual
      required: [rootAnilistId]
      properties:
        rootAnilistId:
          $ref: '#/components/schemas/AnilistId'

    FranchiseSummary:
      type: object
      description: Resumo de uma franquia pra listagem
      required: [root, kind, memberCount]
      properties:
        root:
          $ref: '#/components/schemas/AnimeBindingSummary'
        kind:
          $ref: '#/components/schemas/FranchiseKind'
        memberCount:
          type: integer
          format: int32
          description: Quantidade de membros, contando a raiz

    FranchiseSummaryPage:
      description: Envelope paginado de franquias
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FranchiseSummary'

    AnimeBindingSummaryPage:
      description: Envelope paginado de resumos de anime
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AnimeBindingSummary'

    FranchiseMember:
      type: object
      description: Membro da franquia
      required: [anime, assignment]
      properties:
        anime:
          $ref: '#/components/schemas/AnimeResponse'
        assignment:
          allOf: [{ $ref: '#/components/schemas/FranchiseAssignment' }]
          description: Atribuição do membro (`AUTO`, `MANUAL_MEMBER` ou `MANUAL_ROOT`; membro nunca é `HIDDEN`)
        autoParentId:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          nullable: true
          description: Pai automático do membro, mesmo que ele esteja em outra franquia

    FranchiseRelatedAnime:
      type: object
      description: |
        Anime da coleção com aresta pra algum membro, mas em outra franquia ou oculto. Um item
        por anime, com a aresta de menor id (as demais estão em `edges`), ordenados por
        `anilistId`
      required: [anime, relationType, memberId]
      properties:
        anime:
          $ref: '#/components/schemas/AnimeBindingSummary'
        currentRoot:
          allOf: [{ $ref: '#/components/schemas/AnimeBindingSummary' }]
          nullable: true
          description: Raiz da franquia em que o anime está hoje; `null` se está oculto
        relationType:
          type: string
          description: 'Tipo da aresta como gravada (ex.: `SEQUEL`, `SIDE_STORY`)'
        memberId:
          allOf: [{ $ref: '#/components/schemas/AnilistId' }]
          description: Membro na outra ponta da aresta

    FranchiseDetail:
      type: object
      description: Franquia detalhada pra organização no portal
      required: [root, kind]
      properties:
        root:
          $ref: '#/components/schemas/AnimeResponse'
        kind:
          $ref: '#/components/schemas/FranchiseKind'
        members:
          type: array
          nullable: true
          description: Membros da franquia, incluindo a raiz, ordenados por `anilistId`
          items:
            $ref: '#/components/schemas/FranchiseMember'
        related:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FranchiseRelatedAnime'
        edges:
          type: array
          nullable: true
          description: Arestas entre membros e entre membros e `related`, pro desenho
          items:
            $ref: '#/components/schemas/AnimeRelationEdge'
        seasons:
          type: array
          nullable: true
          description: Prévia de `seasons` em `GET /v1/metadata/animes/{anilistId}/franchise`
          items:
            $ref: '#/components/schemas/AnilistId'
        movies:
          type: array
          nullable: true
          description: Prévia de `movies`
          items:
            $ref: '#/components/schemas/AnilistId'
        specials:
          type: array
          nullable: true
          description: Prévia de `specials`
          items:
            $ref: '#/components/schemas/AnilistId'

    TmdbBindingRequest:
      type: object
      description: Payload de binding TMDB
      required: [tmdbId, mediaType]
      properties:
        tmdbId:
          $ref: '#/components/schemas/TmdbId'
        mediaType:
          $ref: '#/components/schemas/TmdbMediaType'

    TmdbBindingProposalRequest:
      type: object
      description: Anime da AniList pra propor o binding TMDB
      required: [anilistId]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'

    TmdbBindingProposalResponse:
      type: object
      description: |
        Série ou filme do TMDB proposto pro anime, pelo mapeamento do anibridge. `tmdbId` e
        `mediaType` são exatamente o payload de `POST /v1/metadata/animes/{anilistId}/tmdb/binding`.
      required: [tmdbId, mediaType, details]
      properties:
        tmdbId:
          $ref: '#/components/schemas/TmdbId'
        mediaType:
          $ref: '#/components/schemas/TmdbMediaType'
        details:
          allOf: [{ $ref: '#/components/schemas/TmdbBindingDetails' }]
          description: |
            Ficha do título proposto, como está no TMDB — mesma ficha devolvida no estado do
            binding (`TmdbAnimeStateResponse.details`), pra conferir se a proposta aponta pro
            título certo antes de vincular.

    TmdbOverrides:
      type: object
      description: |
        Overrides TMDB — todos os campos opcionais; `null` significa "não sobrepõe".
        Também usado como body de PUT (body com todos `null` apaga a linha); os campos
        `*PreviewUrl` são só de leitura, ignorados num PUT.
      properties:
        title:
          type: string
          nullable: true
        synopsis:
          type: string
          nullable: true
        posterPath:
          type: string
          nullable: true
          description: Caminho relativo do poster (`filePath` cru do TMDB)
        posterPreviewUrl:
          type: string
          nullable: true
          description: URL completa do CDN do TMDB, já pronta pra exibir (derivada de `posterPath`)
        backdropPath:
          type: string
          nullable: true
        backdropPreviewUrl:
          type: string
          nullable: true
          description: URL completa do CDN do TMDB, já pronta pra exibir (derivada de `backdropPath`)
        logoPath:
          type: string
          nullable: true
        logoPreviewUrl:
          type: string
          nullable: true
          description: URL completa do CDN do TMDB, já pronta pra exibir (derivada de `logoPath`)

    TmdbAnimeStateResponse:
      type: object
      description: Estado TMDB do anime (binding + overrides + dados do próprio TMDB)
      required: [details]
      properties:
        tmdbId:
          allOf: [{ $ref: '#/components/schemas/TmdbId' }]
          nullable: true
        mediaType:
          allOf: [{ $ref: '#/components/schemas/TmdbMediaType' }]
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        overrides:
          allOf: [{ $ref: '#/components/schemas/TmdbOverrides' }]
          nullable: true
        details:
          allOf: [{ $ref: '#/components/schemas/TmdbBindingDetails' }]
          description: |
            Dados da série ou filme vinculado, como estão no TMDB — sem overrides aplicados, pra
            conferir se o binding aponta pro título certo. Lidos da ficha do TMDB (cache-first).

    TmdbBindingDetails:
      type: object
      description: |
        Ficha resumida da série (`mediaType` `TV`) ou filme (`MOVIE`) vinculado. A ficha é
        buscada no TMDB sem `language`, então os textos (título, sinopse, gêneros) vêm no idioma
        padrão do TMDB (`en-US`), não em `tmdb.default-language`. Campos que só existem num dos
        tipos vêm `null` no outro.
      properties:
        title:
          type: string
          nullable: true
          description: Nome da série (`name`) ou título do filme (`title`)
        originalTitle:
          type: string
          nullable: true
          description: Nome no idioma original (`original_name` / `original_title`)
        originalLanguage:
          allOf: [{ $ref: '#/components/schemas/LanguageCode' }]
          nullable: true
        overview:
          type: string
          nullable: true
          description: Sinopse
        releaseDate:
          type: string
          nullable: true
          description: Data de estreia (`first_air_date`) ou de lançamento (`release_date`), em ISO-8601
        status:
          type: string
          nullable: true
          description: 'Status no TMDB (ex.: `Ended`, `Returning Series`, `Released`)'
        numberOfSeasons:
          type: integer
          format: int32
          nullable: true
          description: Quantidade de temporadas; só `TV`
        numberOfEpisodes:
          type: integer
          format: int32
          nullable: true
          description: Quantidade de episódios; só `TV`
        runtime:
          type: integer
          format: int32
          nullable: true
          description: Duração em minutos; só `MOVIE`
        genres:
          type: array
          description: Nomes dos gêneros, no idioma da ficha
          items:
            type: string
        voteAverage:
          allOf: [{ $ref: '#/components/schemas/VoteAverage' }]
          nullable: true
        posterPath:
          type: string
          nullable: true
          description: Caminho relativo do poster principal (`poster_path` cru do TMDB)
        posterUrl:
          allOf: [{ $ref: '#/components/schemas/ImageUrl' }]
          nullable: true
          description: URL absoluta do poster principal (tamanho `w342`)
        backdropUrl:
          allOf: [{ $ref: '#/components/schemas/ImageUrl' }]
          nullable: true
          description: URL absoluta do backdrop principal (tamanho `original`)

    TmdbLocalizedOption:
      type: object
      description: |
        Opção textual do schema de overrides. `value` é o que o front grava como override;
        `language` é apenas para exibição (badge de idioma).
      properties:
        value:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
          description: |
            ISO 639-1, seguido do país ISO 3166-1 quando o TMDB informa (`pt-BR`, `zh-TW`);
            `null` quando o TMDB não informa.

    TmdbImageOption:
      type: object
      description: |
        Opção de imagem do schema de overrides. `value` é o `filePath` cru; `previewUrl`
        é a URL completa pronta para renderizar.
      properties:
        value:
          type: string
          nullable: true
          description: '`filePath` relativo (grava em overrides)'
        previewUrl:
          type: string
          nullable: true
          description: URL completa para preview
        language:
          type: string
          nullable: true
          description: ISO 639-1; `null` para variantes neutras
        width:
          type: integer
          format: int32
          nullable: true
        height:
          type: integer
          format: int32
          nullable: true

    TmdbOverridesSchema:
      type: object
      description: Opções concretas por campo que aceita override (traduções e imagens)
      properties:
        title:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbLocalizedOption'
        synopsis:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbLocalizedOption'
        posterPath:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbImageOption'
        backdropPath:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbImageOption'
        logoPath:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbImageOption'

    TmdbFilePairingSchemaEpisode:
      type: object
      description: Episódio numa temporada do schema de pairing
      properties:
        episodeNumber:
          type: integer
          format: int32
          nullable: true
        name:
          type: string
          nullable: true
        overview:
          type: string
          nullable: true
          description: Sinopse curta do episódio
        airDate:
          type: string
          nullable: true
          description: Data de estreia ISO-8601 (`null` para episódios futuros)
        runtime:
          type: integer
          format: int32
          nullable: true
          description: Duração em minutos
        voteAverage:
          type: number
          format: double
          nullable: true
          description: Nota média do TMDB
        voteCount:
          type: integer
          format: int32
          nullable: true
          description: Total de votos que compõem a nota média
        episodeType:
          type: string
          nullable: true
          description: 'Classificação do TMDB (ex.: `standard`, `finale`)'
        defaultStillPath:
          type: string
          nullable: true
          description: Valor a mandar em `thumbnailPath` do PUT
        defaultStillPreviewUrl:
          type: string
          nullable: true
          description: URL já dimensionada para preview no modal

    TmdbFilePairingSchemaSeason:
      type: object
      description: Temporada no schema de pairing
      properties:
        seasonNumber:
          type: integer
          format: int32
          nullable: true
          description: '`0` = specials'
        name:
          type: string
          nullable: true
        episodes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbFilePairingSchemaEpisode'

    TmdbFilePairingSchema:
      type: object
      description: |
        Estrutura da série TMDB vinculada — temporadas com episódios. Consumido pelo
        modal do PUT do pairing, para o cliente não precisar adivinhar temporada/episódio.
      properties:
        seasons:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TmdbFilePairingSchemaSeason'

    TmdbFilePairingRequest:
      type: object
      description: |
        Payload de PUT — descreve o estado completo do pairing. Todos campos opcionais;
        `null` zera aquela dimensão. Para remover a linha inteira use DELETE. Os campos
        `episode*` vêm prontos do `TmdbFilePairingSchemaEpisode` escolhido no modal — o
        servidor não rebusca no TMDB, só persiste o que o cliente mandar.
      properties:
        seasonNumber:
          type: integer
          format: int32
          nullable: true
        episodeNumber:
          type: integer
          format: int32
          nullable: true
        thumbnailPath:
          type: string
          nullable: true
          description: '`filePath` relativo do CDN do TMDB'
        episodeName:
          type: string
          nullable: true
        episodeOverview:
          type: string
          nullable: true
        episodeAirDate:
          type: string
          nullable: true
          description: Data de estreia ISO-8601
        episodeRuntime:
          type: integer
          format: int32
          nullable: true
          description: Duração em minutos
        episodeVoteAverage:
          type: number
          format: double
          nullable: true
        episodeVoteCount:
          type: integer
          format: int32
          nullable: true
        episodeType:
          type: string
          nullable: true
          description: 'Classificação do TMDB (ex.: `standard`, `finale`)'

    TmdbFilePairingProposalRequest:
      type: object
      description: Anime cujos arquivos devem receber a proposta de pairing
      required: [anilistId]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        strategy:
          $ref: '#/components/schemas/TmdbFilePairingStrategy'

    TmdbFilePairingStrategy:
      type: string
      default: ANIBRIDGE
      description: |
        Como a proposta de pairing é calculada.

        - `ANIBRIDGE` — número do episódio extraído do nome do arquivo, convertido pelo
          anibridge pra temporada/episódio da série vinculada.
        - `CONTINUITY` — episódio seguinte ao do arquivo pareado anterior, pela estrutura da
          série no TMDB; não consulta o anibridge.
      enum:
        - ANIBRIDGE
        - CONTINUITY

    TmdbFilePairingChange:
      type: string
      description: |
        Comparação da proposta com o par atual do arquivo.

        - `NEW` — o arquivo não tem par gravado.
        - `SAME` — a proposta é igual ao par gravado.
        - `REPLACE` — a proposta substituiria um par gravado diferente.
      enum:
        - NEW
        - SAME
        - REPLACE

    TmdbFilePairingProposalStatus:
      type: string
      description: |
        Resultado da proposta pra um arquivo. Entre colchetes, a estratégia em que o status
        aparece.

        - `PAIRED` [`ANIBRIDGE`, `CONTINUITY`] — há proposta: `seasonNumber`/`episodeNumber`
          resolvidos e confirmados no TMDB. Na `ANIBRIDGE` pode vir com `usedByFileId` (episódio
          já usado por outro arquivo); na `CONTINUITY` esse caso vira `EPISODE_IN_USE`.
        - `NO_EPISODE_NUMBER` [`ANIBRIDGE`] — não deu pra extrair um número de episódio do nome
          do arquivo.
        - `NOT_MAPPED` [`ANIBRIDGE`] — o número extraído não cai em nenhum mapeamento do
          anibridge pra série vinculada.
        - `AMBIGUOUS_ABSOLUTE_NUMBERING` [`ANIBRIDGE`] — o arquivo usa numeração absoluta, mas o
          mapeamento do anibridge não cobre a temporada isolada com segurança pra aplicar o
          offset.
        - `NOT_FOUND_IN_TMDB` [`ANIBRIDGE`] — o anibridge resolveu `seasonNumber`/`episodeNumber`,
          mas o episódio não existe no TMDB (temporada inexistente, episódio fora da temporada,
          ou a busca no TMDB falhou) — o anibridge pode estar dessincronizado do TMDB.
        - `NO_MAPPING` [`ANIBRIDGE`] — o anibridge não tem mapeamento do anime pra série
          vinculada (vale pra todos os arquivos).
        - `CONFLICTING_MAPPING` [`ANIBRIDGE`] — o mapeamento do anibridge pra série vinculada tem
          temporadas conflitantes e não é usado (vale pra todos os arquivos).
        - `NO_ANCHOR` [`CONTINUITY`] — não há arquivo pareado antes deste na pasta.
        - `END_OF_SERIES` [`CONTINUITY`] — não há episódio seguinte ao da âncora (fim da última
          temporada da série).
        - `EPISODE_IN_USE` [`CONTINUITY`] — o episódio seguinte já está gravado em outro arquivo
          ou foi proposto antes pra outro arquivo nesta mesma proposta (`usedByFileId`). Não vem
          pré-selecionado; o arquivo continua sendo a âncora do próximo.
        - `OUT_OF_AIR_WINDOW` [`ANIBRIDGE`] — o anibridge resolveu `seasonNumber`/`episodeNumber`
          e o episódio existe no TMDB, mas foi ao ar a mais de 365 dias antes da estreia ou depois
          do fim do anime na AniList — provavelmente outra temporada ou outro anime da franquia.
      enum:
        - PAIRED
        - NO_EPISODE_NUMBER
        - NOT_MAPPED
        - AMBIGUOUS_ABSOLUTE_NUMBERING
        - NOT_FOUND_IN_TMDB
        - NO_MAPPING
        - CONFLICTING_MAPPING
        - NO_ANCHOR
        - END_OF_SERIES
        - EPISODE_IN_USE
        - OUT_OF_AIR_WINDOW

    TmdbFilePairingProposal:
      type: object
      description: Proposta de pairing de um arquivo de vídeo
      required: [fileId, fileName, status, selectedByDefault]
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
        fileName:
          type: string
          description: Nome do arquivo, de onde o número do episódio é extraído
        status:
          $ref: '#/components/schemas/TmdbFilePairingProposalStatus'
        seasonNumber:
          type: integer
          format: int32
          nullable: true
          description: |
            Temporada do TMDB proposta; preenchida em `PAIRED` e `EPISODE_IN_USE`, e em
            `NOT_FOUND_IN_TMDB` (aí mostra pra onde o anibridge apontou)
        episodeNumber:
          type: integer
          format: int32
          nullable: true
          description: |
            Episódio do TMDB proposto; preenchido nos mesmos status que `seasonNumber`
        currentSeasonNumber:
          type: integer
          format: int32
          nullable: true
          description: Temporada do par gravado hoje pro arquivo; `null` se ele não tem par
        currentEpisodeNumber:
          type: integer
          format: int32
          nullable: true
          description: Episódio do par gravado hoje pro arquivo; `null` se ele não tem par
        change:
          allOf: [{ $ref: '#/components/schemas/TmdbFilePairingChange' }]
          nullable: true
          description: |
            Comparação da proposta com o par atual; `null` quando não há proposta (qualquer
            status fora `PAIRED` e `EPISODE_IN_USE`)
        selectedByDefault:
          type: boolean
          description: |
            Se a proposta deve vir marcada no portal: `change` = `NEW` e episódio sem uso por
            outro arquivo (`usedByFileId` `null`). Vale igual pras duas estratégias e pra
            qualquer temporada, inclusive a 0.
        basedOnFileId:
          allOf: [{ $ref: '#/components/schemas/FileId' }]
          nullable: true
          description: |
            Arquivo âncora de onde a proposta continua (o pareado anterior na pasta); só na
            `CONTINUITY`, em `PAIRED` e `EPISODE_IN_USE` de arquivo sem par próprio
        usedByFileId:
          allOf: [{ $ref: '#/components/schemas/FileId' }]
          nullable: true
          description: |
            Outro arquivo que já usa o episódio proposto — com o par gravado, ou proposto antes
            dele nesta mesma proposta (na ordem da lista); `null` se ninguém usa
        pairing:
          allOf: [{ $ref: '#/components/schemas/TmdbFilePairingRequest' }]
          nullable: true
          description: |
            Payload pronto pra `PUT /v1/metadata/files/{fileId}/tmdb-pairing`, com a metadata do
            episódio proposto no TMDB (thumbnail, nome, sinopse etc.); preenchido em `PAIRED` e
            `EPISODE_IN_USE` quando o episódio existe no TMDB

    TmdbFilePairingProposalResponse:
      type: object
      description: Proposta de pairing de todos os arquivos da pasta do anime
      required: [anilistId, tmdbId, files]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'
        tmdbId:
          allOf: [{ $ref: '#/components/schemas/TmdbId' }]
          description: Série do TMDB vinculada ao anime, base da proposta
        files:
          type: array
          description: Todos os arquivos de vídeo da pasta do anime, na ordem natural dos nomes
          items:
            $ref: '#/components/schemas/TmdbFilePairingProposal'

    TmdbFilePairingResponse:
      type: object
      description: Pairing atual (campos `null` refletem estado parcial)
      properties:
        fileId:
          allOf: [{ $ref: '#/components/schemas/FileId' }]
          nullable: true
        seasonNumber:
          type: integer
          format: int32
          nullable: true
        episodeNumber:
          type: integer
          format: int32
          nullable: true
        thumbnailPath:
          type: string
          nullable: true
        thumbnailPreviewUrl:
          type: string
          nullable: true
          description: URL completa do CDN do TMDB, já pronta pra exibir (derivada de `thumbnailPath`)
        episodeName:
          type: string
          nullable: true
        episodeOverview:
          type: string
          nullable: true
        episodeAirDate:
          type: string
          nullable: true
          description: Data de estreia ISO-8601
        episodeRuntime:
          type: integer
          format: int32
          nullable: true
          description: Duração em minutos
        episodeVoteAverage:
          type: number
          format: double
          nullable: true
        episodeVoteCount:
          type: integer
          format: int32
          nullable: true
        episodeType:
          type: string
          nullable: true
          description: 'Classificação do TMDB (ex.: `standard`, `finale`)'

    # ---------- settings ----------
    SettingKey:
      type: string
      minLength: 1
      description: Identificador da preferência

    SettingValue:
      type: string
      description: Valor cru da preferência (interpretado pelo tipo no ponto de leitura)

    SettingResponse:
      type: object
      description: Preferência do admin; o `value` de preferências `secret` vem mascarado, nunca o valor cru
      required: [key, secret, configured, updatedAt]
      properties:
        key:
          $ref: '#/components/schemas/SettingKey'
        value:
          type: string
          nullable: true
          description: >-
            `***` quando `secret` é `true` (o valor cru nunca é ecoado); senão o valor cru, que
            pode ser `null` quando a preferência ainda não foi configurada
        secret:
          type: boolean
          description: >-
            `true` para preferências sensíveis (ex.: tokens) — o portal renderiza como senha
        configured:
          type: boolean
          description: >-
            `true` se há um valor não-vazio cadastrado (útil para secrets, cujo `value` é mascarado)
        updatedAt:
          type: string
          format: date-time
          description: Momento da última atualização

    UpdateSettingRequest:
      type: object
      description: Payload de `PUT /v1/settings/{key}`
      required: [value]
      properties:
        value:
          allOf: [{ $ref: '#/components/schemas/SettingValue' }]
          description: 'Novo valor; string vazia é permitida (ex.: limpar um secret)'

    SettingList:
      type: array
      description: Lista de preferências, ordenada pela chave
      items:
        $ref: '#/components/schemas/SettingResponse'

    # ---------- notification ----------
    NotificationLevel:
      type: string
      description: Severidade da notificação
      enum:
        - INFO
        - WARNING
        - ERROR

    NotificationResponse:
      type: object
      description: |
        Notificação de observabilidade — hoje nenhum domínio gera notificação.
      required: [id, level, message, read, createdAt]
      properties:
        id:
          type: integer
          format: int32
          description: Id da notificação
        level:
          $ref: '#/components/schemas/NotificationLevel'
        message:
          type: string
          description: Texto pronto para exibir ao admin
        folderId:
          allOf: [{ $ref: '#/components/schemas/FolderId' }]
          nullable: true
          description: |
            Pasta do catalog do título a que a notificação se refere — o portal usa para linkar a
            revisão. `null` quando a notificação não é sobre um título.
        title:
          type: string
          nullable: true
          description: >-
            Título a que a notificação se refere; `null` nas mesmas condições de `folderId`
        coverImageUrl:
          type: string
          nullable: true
          description: URL da capa em tamanho pequeno (ícone); `null` quando não há capa conhecida
        read:
          type: boolean
          description: '`true` se o admin já marcou como lida'
        createdAt:
          type: string
          format: date-time
          description: Momento em que a notificação foi gerada

    NotificationPage:
      description: Envelope paginado de notificações
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/NotificationResponse'

    UnreadCountResponse:
      type: object
      description: Contagem de notificações não-lidas
      required: [count]
      properties:
        count:
          type: integer
          format: int32

    NotificationEventType:
      type: string
      description: |
        Tipo de um evento do stream SSE `GET /v1/notifications/events`. É também o `event:`
        (nome) da mensagem SSE, então o cliente pode tanto registrar um listener por nome
        (`addEventListener('NEW', ...)`) quanto ler o campo `type` do payload.

        - `NEW` — uma notificação acabou de ser criada.
      enum:
        - NEW

    NotificationEvent:
      type: object
      description: |
        Payload (`data:`, JSON) de cada mensagem do stream SSE `GET /v1/notifications/events` —
        o endpoint não é descrito em `paths` (Server-Sent Events não é modelável pelo gerador
        `jaxrs-spec`), só este payload.

        O stream é aberto com `EventSource` (`GET`, `Accept: text/event-stream`) e fica aberto
        indefinidamente, sem evento inicial: a primeira mensagem só chega quando uma notificação
        nova é criada. Cada mensagem tem `event:` igual ao `type` e o `data:` com este objeto. O
        stream só avisa de notificações novas — o histórico e a contagem de não-lidas continuam
        em `GET /v1/notifications` e `GET /v1/notifications/unread-count`; um cliente que
        reconecta depois de uma queda deve recarregar por eles o que pode ter perdido.
      required: [type, notification]
      properties:
        type:
          $ref: '#/components/schemas/NotificationEventType'
        notification:
          allOf: [{ $ref: '#/components/schemas/NotificationResponse' }]
          description: |
            A notificação recém-criada, no mesmo formato da listagem — sempre com `read = false`

    # ---------- smartlist ----------
    SmartListSortField:
      type: string
      description: |
        Campo da raiz usado na ordenação dos itens.

        - `SCORE` — média ponderada da AniList.
        - `MEAN_SCORE` — média simples da AniList.
        - `POPULARITY` — popularidade na AniList.
        - `YEAR` — ano da temporada de lançamento.
        - `TITLE` — título principal.
      enum:
        - SCORE
        - MEAN_SCORE
        - POPULARITY
        - YEAR
        - TITLE

    SortDirection:
      type: string
      description: Direção da ordenação
      enum:
        - ASC
        - DESC

    SmartListCriteria:
      type: object
      description: |
        Filtro da lista. Todos os campos são opcionais; campo ausente não filtra. Valores de
        texto usam os nomes da AniList (ex.: `Comedy`, `TV`, `RELEASING`).
      properties:
        includeGenres:
          type: array
          nullable: true
          description: Gêneros que o membro precisa ter, todos
          items:
            type: string
        excludeGenres:
          type: array
          nullable: true
          description: Gêneros que o membro não pode ter, nenhum
          items:
            type: string
        includeTags:
          type: array
          nullable: true
          description: Tags que o membro precisa ter, todas
          items:
            type: string
        excludeTags:
          type: array
          nullable: true
          description: Tags que o membro não pode ter, nenhuma
          items:
            type: string
        studios:
          type: array
          nullable: true
          description: Estúdios aceitos pro membro, qualquer um
          items:
            type: string
        statuses:
          type: array
          nullable: true
          description: Status aceitos pro membro, qualquer um (`FINISHED`, `RELEASING`, ...)
          items:
            type: string
        formats:
          type: array
          nullable: true
          description: Formatos aceitos pra raiz, qualquer um (`TV`, `MOVIE`, ...)
          items:
            type: string
        yearFrom:
          type: integer
          format: int32
          nullable: true
          description: Ano mínimo de lançamento da raiz, inclusivo
        yearTo:
          type: integer
          format: int32
          nullable: true
          description: Ano máximo de lançamento da raiz, inclusivo
        minScore:
          type: number
          format: double
          nullable: true
          description: Média ponderada mínima da raiz (0–10)
        minMeanScore:
          type: number
          format: double
          nullable: true
          description: Média simples mínima da raiz (0–10)
        minPopularity:
          type: integer
          format: int32
          nullable: true
          description: Popularidade mínima da raiz
        adult:
          type: boolean
          nullable: true
          description: '`true` membro adulto, `false` membro não adulto; ausente não filtra'

    SmartListRequest:
      type: object
      description: Payload de `POST /v1/smart-lists` e `PUT /v1/smart-lists/{listId}`
      required: [name, position, criteria, sortField]
      properties:
        name:
          type: string
          minLength: 1
          description: Nome exibido no front
        position:
          type: integer
          format: int32
          minimum: 0
          description: Posição na listagem das listas; menor aparece primeiro
        criteria:
          allOf: [{ $ref: '#/components/schemas/SmartListCriteria' }]
          description: Filtro da lista; `{}` não filtra nada
        sortField:
          $ref: '#/components/schemas/SmartListSortField'
        sortDirection:
          allOf: [{ $ref: '#/components/schemas/SortDirection' }]
          default: DESC

    SmartListResponse:
      type: object
      description: Lista cadastrada
      required: [id, name, position, criteria, sortField, sortDirection, createdAt]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        position:
          type: integer
          format: int32
        criteria:
          $ref: '#/components/schemas/SmartListCriteria'
        sortField:
          $ref: '#/components/schemas/SmartListSortField'
        sortDirection:
          $ref: '#/components/schemas/SortDirection'
        createdAt:
          type: string
          format: date-time

    SmartListList:
      type: array
      description: Listas cadastradas, ordenadas por `position` e `id`
      items:
        $ref: '#/components/schemas/SmartListResponse'

    # ---------- user ----------
    UserId:
      type: integer
      format: int32
      description: Id do usuário

    UserRequest:
      type: object
      description: Payload de `POST /v1/users`
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Nome exibido no seletor de perfis

    UserResponse:
      type: object
      description: Usuário cadastrado
      required: [id, name, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    UserList:
      type: array
      description: Usuários cadastrados, ordenados por `id`
      items:
        $ref: '#/components/schemas/UserResponse'

    WatchlistItemRequest:
      type: object
      description: Payload de `POST /v1/users/{userId}/watchlist`
      required: [anilistId]
      properties:
        anilistId:
          $ref: '#/components/schemas/AnilistId'

    PlaybackHeartbeatRequest:
      type: object
      description: Posição atual do player, enviada no heartbeat
      properties:
        positionSeconds:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: |
            Posição atual, em segundos a partir do início da mídia (mesma semântica do
            `positionSeconds` do seek), não o `currentTime` da playlist. Numa sessão iniciada com
            `userId`, vira a posição do arquivo no histórico do usuário; sem `userId`, é
            ignorada.

    WatchProgress:
      type: object
      description: Progresso do usuário num arquivo
      required: [positionSeconds, watched, lastWatchedAt]
      properties:
        positionSeconds:
          type: number
          format: double
          description: Última posição recebida no heartbeat, em segundos a partir do início da mídia
        durationSeconds:
          type: number
          format: double
          nullable: true
          description: Duração da mídia, em segundos; `null` se o probe não informou
        watched:
          type: boolean
          description: |
            `true` quando alguma posição recebida chegou a 90% da duração. Uma vez `true`,
            continua `true`, mesmo se o usuário rever o episódio do começo.
        lastWatchedAt:
          type: string
          format: date-time
          description: Quando a última posição foi recebida
